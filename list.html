<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUnCh — Tokyo Exhibitions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Noto+Serif+JP:wght@300;400&display=swap" rel="stylesheet">

  <style>
    :root {
      --cream: #f0ebe0;
      --gold:  #c9a84c;
      --dark:  #0a0a0a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--dark);
      color: var(--cream);
      font-family: 'Cormorant Garamond', 'Noto Serif JP', serif;
      min-height: 100vh;
    }

    /* ヘッダー */
    .header {
      padding: 32px 48px 28px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 1px solid rgba(240,235,224,0.08);
    }

    .logo {
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: rgba(240,235,224,0.4);
    }

    .page-title {
      font-size: 26px;
      font-weight: 300;
      font-style: italic;
      letter-spacing: 0.04em;
      color: var(--cream);
      margin-top: 6px;
    }

    .back-btn {
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: rgba(240,235,224,0.35);
      text-decoration: none;
      border-bottom: 1px solid rgba(240,235,224,0.15);
      padding-bottom: 2px;
      transition: color 0.3s, border-color 0.3s;
    }

    .back-btn:hover {
      color: var(--gold);
      border-color: var(--gold);
    }

    /* コントロール */
    .controls {
      padding: 18px 48px;
      display: flex;
      align-items: center;
      gap: 20px;
      border-bottom: 1px solid rgba(240,235,224,0.06);
    }

    .controls-label {
      font-size: 9px;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: rgba(240,235,224,0.25);
    }

    .sort-select {
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(240,235,224,0.18);
      color: var(--cream);
      font-family: 'Cormorant Garamond', serif;
      font-size: 14px;
      letter-spacing: 0.05em;
      padding: 2px 0;
      cursor: pointer;
      outline: none;
    }

    .sort-select option { background: #111; }

    .count {
      margin-left: auto;
      font-size: 10px;
      letter-spacing: 0.25em;
      color: rgba(240,235,224,0.2);
    }

    /* ステータス（エラー時のみ表示） */
    #status {
      display: none;
      padding: 16px 48px;
      font-size: 12px;
      letter-spacing: 0.05em;
      color: rgba(224,90,90,0.7);
    }

    /* グリッド */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1px;
      background: rgba(240,235,224,0.05);
      margin: 1px;
    }

    /* カード */
    .card {
      background: var(--dark);
      position: relative;
    }

    .card-link {
      display: block;
      text-decoration: none;
      color: inherit;
    }

    /* 画像エリア */
    .card-img-wrap {
      position: relative;
      aspect-ratio: 2 / 3;
      overflow: hidden;
    }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: sepia(0.12) contrast(1.04);
      transition: transform 0.7s cubic-bezier(0.16,1,0.3,1), filter 0.4s;
    }

    .card:hover .card-img {
      transform: scale(1.05);
      filter: sepia(0) contrast(1.08);
    }

    .card-img-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to top,
        rgba(10,10,10,0.95) 0%,
        rgba(10,10,10,0.45) 40%,
        rgba(10,10,10,0.05) 100%
      );
      transition: opacity 0.4s;
    }

    .card:hover .card-img-overlay {
      opacity: 0.85;
    }

    /* カード内テキスト（画像上） */
    .card-info {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 0 18px 20px;
    }

    .card-date {
      font-size: 9px;
      color: var(--gold);
      letter-spacing: 0.18em;
      margin-bottom: 7px;
    }

    .card-title {
      font-family: 'Noto Serif JP', serif;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.7;
      letter-spacing: 0.04em;
      color: var(--cream);
    }

    .card-museum {
      font-size: 10px;
      color: rgba(240,235,224,0.38);
      letter-spacing: 0.1em;
      margin-top: 5px;
    }

    .card-copy {
      font-size: 10px;
      font-style: italic;
      color: rgba(240,235,224,0.28);
      margin-top: 8px;
      line-height: 1.5;
    }

    /* ラベル（左上）*/
    .card-now {
      position: absolute;
      top: 14px;
      left: 14px;
      font-size: 7px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(240,235,224,0.5);
      border: 1px solid rgba(240,235,224,0.18);
      padding: 3px 7px;
    }

    /* 終了間近ラベル（右上）*/
    .card-ending {
      position: absolute;
      top: 14px;
      right: 14px;
      font-size: 7px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(220,80,80,0.85);
      border: 1px solid rgba(220,80,80,0.3);
      padding: 3px 7px;
    }

    /* カード下部 */
    .card-footer {
      padding: 10px 18px 12px;
      display: flex;
      gap: 16px;
      border-top: 1px solid rgba(240,235,224,0.05);
    }

    .card-footer a {
      font-size: 10px;
      color: rgba(240,235,224,0.25);
      text-decoration: none;
      letter-spacing: 0.08em;
      transition: color 0.3s;
    }

    .card-footer a:hover { color: var(--gold); }

    .card-distance {
      font-size: 10px;
      color: rgba(240,235,224,0.2);
      padding: 0 18px 10px;
      letter-spacing: 0.05em;
    }

    /* 空状態 */
    .empty {
      grid-column: 1 / -1;
      padding: 80px;
      text-align: center;
      font-size: 13px;
      letter-spacing: 0.15em;
      color: rgba(240,235,224,0.18);
    }

    /* フッター */
    .footer {
      padding: 40px 48px;
      border-top: 1px solid rgba(240,235,224,0.06);
      margin-top: 1px;
      text-align: center;
    }

    .footer-text {
      font-size: 10px;
      letter-spacing: 0.3em;
      color: rgba(240,235,224,0.12);
      text-transform: uppercase;
      font-style: italic;
    }

    @media (max-width: 480px) {
      .header   { padding: 24px 20px 20px; }
      .controls { padding: 14px 20px; }
      .page-title { font-size: 20px; }
    }
  </style>
</head>
<body>

  <header class="header">
    <div>
      <div class="logo">MUnCh — Tokyo Exhibitions</div>
      <div class="page-title">開催中の特別展</div>
    </div>
    <a href="index.html" class="back-btn">← Back</a>
  </header>

  <div class="controls">
    <span class="controls-label">Sort</span>
    <select id="sort" class="sort-select">
      <option value="end">終了が近い順</option>
      <option value="title">タイトル順</option>
      <option value="near">近い順</option>
      <option value="ueno">上野エリア</option>
    </select>
    <span class="count" id="count"></span>
  </div>

  <div id="status"></div>
  <div class="grid" id="list"></div>

  <footer class="footer">
    <div class="footer-text">東京の展覧会を、映画のように。</div>
  </footer>

  <script>
  const museumCoords = {
    "東京都美術館":               { lat: 35.7172, lng: 139.7765 },
    "東京国立近代美術館":          { lat: 35.6909, lng: 139.7544 },
    "東京藝術大学大学美術館":      { lat: 35.7188, lng: 139.7753 },
    "国立西洋美術館":              { lat: 35.7155, lng: 139.7757 },
    "上野の森美術館":              { lat: 35.7130, lng: 139.7736 },
    "東京都現代美術館":            { lat: 35.6817, lng: 139.8016 },
    "森美術館":                   { lat: 35.6604, lng: 139.7292 },
    "国立新美術館":                { lat: 35.6655, lng: 139.7279 },
    "サントリー美術館":            { lat: 35.6643, lng: 139.7310 },
    "東京国立博物館":              { lat: 35.7188, lng: 139.7764 },
    "江戸東京博物館":              { lat: 35.6966, lng: 139.7973 },
    "世田谷美術館":                { lat: 35.6321, lng: 139.5898 },
    "東京都写真美術館":            { lat: 35.6412, lng: 139.7133 },
    "アーティゾン美術館":          { lat: 35.6805, lng: 139.7680 },
    "パナソニック汐留美術館":      { lat: 35.6641, lng: 139.7590 },
    "三菱一号館美術館":            { lat: 35.6820, lng: 139.7638 },
    "SOMPO美術館":                { lat: 35.6896, lng: 139.6982 },
    "郷さくら美術館":              { lat: 35.6384, lng: 139.7101 },
    "根津美術館":                  { lat: 35.6599, lng: 139.7161 },
    "山種美術館":                  { lat: 35.6631, lng: 139.7203 },
    "畠山記念館":                  { lat: 35.6488, lng: 139.7344 },
    "五島美術館":                  { lat: 35.6185, lng: 139.6613 },
  };

  const defaultCoord = { lat: 35.6895, lng: 139.6917 };
  let exhibitions = [];
  let userLat = null, userLng = null;

  navigator.geolocation.getCurrentPosition(pos => {
    userLat = pos.coords.latitude;
    userLng = pos.coords.longitude;
    render();
  });

  function getDistance(lat1, lng1, lat2, lng2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLng = (lng2 - lng1) * Math.PI / 180;
    const a = Math.sin(dLat/2)**2 +
      Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLng/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  function toWalkTime(km) { return Math.round(km * 15); }

  function formatDate(s) {
    if (!s) return "—";
    const d = new Date(s);
    if (isNaN(d)) return s;
    return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")}`;
  }

  function daysUntil(dateStr) {
    if (!dateStr) return Infinity;
    return Math.ceil((new Date(dateStr) - new Date()) / 86400000);
  }

  function getCoord(name) { return museumCoords[name] || defaultCoord; }

  function getArea(name) {
    const ueno = ["東京都美術館","国立西洋美術館","東京国立博物館","上野の森美術館","東京藝術大学大学美術館","東京国立近代美術館"];
    return ueno.includes(name) ? "上野" : "その他";
  }

  async function fetchExhibitions() {
    try {
      const res = await fetch("exhibitions.json");
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const raw = await res.json();
      exhibitions = raw.map(e => ({ ...e, ...getCoord(e.museum), area: getArea(e.museum) }));
      render();
    } catch (err) {
      const el = document.getElementById("status");
      el.style.display = "block";
      el.textContent = `データ読み込み失敗: exhibitions.json が見つかりません`;
    }
  }

  function render() {
    const sortVal = document.getElementById("sort").value;
    const list    = document.getElementById("list");
    const now     = new Date();

    let data = exhibitions.filter(e => !e.end || new Date(e.end) >= now);

    if (sortVal === "end") {
      data.sort((a,b) => new Date(a.end||"9999") - new Date(b.end||"9999"));
    } else if (sortVal === "title") {
      data.sort((a,b) => a.title.localeCompare(b.title, "ja"));
    } else if (sortVal === "ueno") {
      data = data.filter(e => e.area === "上野");
    } else if (sortVal === "near" && userLat) {
      data.sort((a,b) => getDistance(userLat,userLng,a.lat,a.lng) - getDistance(userLat,userLng,b.lat,b.lng));
    }

    document.getElementById("count").textContent = `${data.length} exhibitions`;
    list.innerHTML = "";

    if (data.length === 0) {
      list.innerHTML = `<div class="empty">該当する展覧会が見つかりませんでした</div>`;
      return;
    }

    data.forEach(e => {
      const days     = daysUntil(e.end);
      const imgSrc   = (e.image_url && e.image_url !== "")
        ? e.image_url
        : `https://picsum.photos/seed/${encodeURIComponent(e.title)}/400/600`;
      const fallback = `https://picsum.photos/seed/${encodeURIComponent(e.museum)}/400/600`;

      let distanceHtml = "";
      if (userLat && userLng) {
        const d = getDistance(userLat, userLng, e.lat, e.lng);
        distanceHtml = `<div class="card-distance">${d.toFixed(1)} km — 徒歩 ${toWalkTime(d)} 分</div>`;
      }

      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <a href="${e.url || '#'}" class="card-link" ${e.url ? 'target="_blank"' : ''}>
          <div class="card-img-wrap">
            <img class="card-img" src="${imgSrc}"
                 onerror="if(this.src!=='${fallback}')this.src='${fallback}'" alt="${e.title}">
            <div class="card-img-overlay"></div>
            <div class="card-now">Now Showing</div>
            ${days <= 7 ? `<div class="card-ending">Ending Soon</div>` : ""}
            <div class="card-info">
              <div class="card-date">${formatDate(e.start)} — ${formatDate(e.end)}</div>
              <div class="card-title">${e.title}</div>
              <div class="card-museum">${e.museum}</div>
              ${e.copy ? `<div class="card-copy">"${e.copy}"</div>` : ""}
            </div>
          </div>
        </a>
        ${distanceHtml}
        <div class="card-footer">
          <a href="https://www.google.com/maps/search/?api=1&query=${e.lat},${e.lng}" target="_blank">地図で見る</a>
          <a href="https://www.google.com/maps/dir/?api=1&destination=${e.lat},${e.lng}" target="_blank">ルート</a>
        </div>
      `;
      list.appendChild(card);
    });
  }

  document.getElementById("sort").addEventListener("change", render);
  fetchExhibitions();
  </script>

</body>
</html>
