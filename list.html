<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUnCh — Tokyo Exhibitions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Noto+Serif+JP:wght@300;400&display=swap" rel="stylesheet">

  <style>
    :root {
      --cream: #f0ebe0;
      --gold:  #c9a84c;
      --dark:  #0a0a0a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--dark);
      color: var(--cream);
      font-family: 'Cormorant Garamond', 'Noto Serif JP', serif;
      min-height: 100vh;
    }

    /* ヘッダー */
    .header {
      padding: 32px 48px 28px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 1px solid rgba(240,235,224,0.08);
    }

    .logo {
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: rgba(240,235,224,0.6);
    }

    .logo-link { text-decoration: none; }

    .page-title {
      font-size: 26px;
      font-weight: 300;
      font-style: italic;
      letter-spacing: 0.04em;
      color: var(--cream);
      margin-top: 6px;
    }

    /* タブナビ */
    .nav-tabs { display: flex; }

    .nav-tab {
      font-family: 'Cormorant Garamond', serif;
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: rgba(240,235,224,0.38);
      text-decoration: none;
      padding: 7px 18px;
      border: 1px solid rgba(240,235,224,0.14);
      transition: color 0.3s, background 0.3s, border-color 0.3s;
    }

    .nav-tab + .nav-tab { border-left: none; }

    .nav-tab.active {
      color: var(--cream);
      background: rgba(240,235,224,0.07);
      border-color: rgba(240,235,224,0.28);
    }

    .nav-tab:hover:not(.active) {
      color: var(--gold);
      border-color: rgba(201,168,76,0.35);
    }

    /* コントロール */
    .controls {
      padding: 18px 48px;
      display: flex;
      align-items: center;
      gap: 20px;
      border-bottom: 1px solid rgba(240,235,224,0.06);
    }

    .controls-label {
      font-size: 9px;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: rgba(240,235,224,0.45);
    }

    .sort-select {
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(240,235,224,0.18);
      color: var(--cream);
      font-family: 'Cormorant Garamond', serif;
      font-size: 14px;
      letter-spacing: 0.05em;
      padding: 2px 0;
      cursor: pointer;
      outline: none;
    }

    .sort-select option { background: #111; }

    .count {
      margin-left: auto;
      font-size: 10px;
      letter-spacing: 0.25em;
      color: rgba(240,235,224,0.2);
    }

    /* ステータス（エラー時のみ表示） */
    #status {
      display: none;
      padding: 16px 48px;
      font-size: 12px;
      letter-spacing: 0.05em;
      color: rgba(224,90,90,0.7);
    }

    /* チケットリスト */
    .grid {
      display: flex;
      flex-direction: column;
      gap: 1px;
      background: rgba(240,235,224,0.05);
      margin: 1px;
    }

    /* カード外枠 */
    .card { background: var(--dark); }

    /* チケット本体 */
    .ticket-link {
      display: flex;
      text-decoration: none;
      color: inherit;
      min-height: 130px;
      background: #f0ebe0;
      position: relative;
      transition: filter 0.3s;
      /* 紙テクスチャ */
      background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.72' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"),
        linear-gradient(160deg, #f5f0e8 0%, #ede8dc 60%, #f0ebe0 100%);
    }
    .ticket-link:hover { filter: brightness(1.03) contrast(1.01); }

    /* 左：画像 */
    .ticket-img-wrap {
      width: 90px;
      flex-shrink: 0;
      overflow: hidden;
    }

    .ticket-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: sepia(0.15) contrast(1.05);
      transition: filter 0.4s;
    }
    .ticket-link:hover .ticket-img { filter: sepia(0) contrast(1.1); }

    /* 中：本文 */
    .ticket-body {
      flex: 1;
      padding: 14px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #111;
    }

    .ticket-admit {
      font-size: 8px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #999;
    }

    .ticket-title {
      font-family: 'Noto Serif JP', serif;
      font-size: 14px;
      font-weight: 400;
      color: #111;
      line-height: 1.55;
      letter-spacing: 0.03em;
      margin-top: 7px;
    }

    .ticket-museum {
      font-family: 'Cormorant Garamond', serif;
      font-size: 12px;
      letter-spacing: 0.1em;
      color: #555;
      margin-top: 5px;
    }

    .ticket-copy {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 12px;
      color: #888;
      margin-top: 5px;
    }

    .ticket-dates {
      font-family: 'Cormorant Garamond', serif;
      font-size: 12px;
      letter-spacing: 0.1em;
      color: #333;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px dashed rgba(0,0,0,0.15);
    }

    /* ミシン目 */
    .ticket-perf {
      width: 14px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      background: #f0ebe0;
    }

    .ticket-perf::after {
      content: '';
      position: absolute;
      top: 8px;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      border-left: 1px dashed rgba(0,0,0,0.18);
    }

    .perf-notch {
      width: 14px;
      height: 7px;
      background: var(--dark);
      flex-shrink: 0;
      z-index: 1;
    }

    .perf-notch.top    { border-radius: 0 0 7px 7px; }
    .perf-notch.bottom { border-radius: 7px 7px 0 0; margin-top: auto; }

    /* 右：スタブ */
    .ticket-stub {
      width: 66px;
      flex-shrink: 0;
      background: #e5e0d5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 0;
    }

    .stub-label {
      writing-mode: vertical-rl;
      font-family: 'Cormorant Garamond', serif;
      font-size: 8px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #bbb;
    }

    .stub-museum {
      writing-mode: vertical-rl;
      font-family: 'Noto Serif JP', serif;
      font-size: 9px;
      letter-spacing: 0.08em;
      color: #777;
      max-height: 80px;
      overflow: hidden;
    }

    .stub-number {
      font-family: 'Cormorant Garamond', serif;
      font-size: 8px;
      color: #ccc;
      letter-spacing: 0.08em;
    }

    /* 終了間近スタンプ */
    .ticket-ending {
      position: absolute;
      bottom: 44px;
      right: 80px;
      font-size: 7px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(200,55,55,0.8);
      border: 1px solid rgba(200,55,55,0.35);
      padding: 3px 7px;
      transform: rotate(-4deg);
      pointer-events: none;
    }

    /* 距離・フッター */
    .card-distance {
      font-family: 'Cormorant Garamond', serif;
      font-size: 11px;
      color: rgba(240,235,224,0.38);
      padding: 6px 18px 4px;
      letter-spacing: 0.05em;
    }

    .card-footer {
      padding: 6px 18px 10px;
      display: flex;
      gap: 16px;
    }

    .card-footer a {
      font-family: 'Cormorant Garamond', serif;
      font-size: 11px;
      color: rgba(240,235,224,0.38);
      text-decoration: none;
      letter-spacing: 0.08em;
      transition: color 0.3s;
    }

    .card-footer a:hover { color: var(--gold); }

    /* ===== パンフレット ===== */
    .pamphlet {
      border-top: 1px solid rgba(240,235,224,0.06);
    }

    /* 表紙タブ（常に表示） */
    .pamphlet-cover {
      display: flex;
      align-items: center;
      padding: 11px 18px;
      cursor: pointer;
      user-select: none;
      background: #e8e3d8;
      background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.72' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"),
        linear-gradient(to right, #e0dbd0, #e8e3d8);
      transition: filter 0.2s;
      gap: 10px;
    }

    .pamphlet-cover:hover { filter: brightness(0.97); }

    .pamphlet-icon {
      font-size: 13px;
      opacity: 0.5;
      flex-shrink: 0;
    }

    .pamphlet-label-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #888;
      flex: 1;
    }

    .pamphlet-chevron {
      font-family: 'Cormorant Garamond', serif;
      font-size: 16px;
      color: #aaa;
      line-height: 1;
      transition: transform 0.35s cubic-bezier(0.16,1,0.3,1);
    }

    .pamphlet.open .pamphlet-chevron {
      transform: rotate(90deg);
    }

    /* 開閉アニメーション */
    .pamphlet-body {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.45s cubic-bezier(0.16,1,0.3,1);
    }

    .pamphlet.open .pamphlet-body {
      grid-template-rows: 1fr;
    }

    .pamphlet-content {
      overflow: hidden;
      min-height: 0;
      display: flex;
      background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.72' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"),
        linear-gradient(160deg, #f5f0e8 0%, #ede8dc 100%);
    }

    /* 左ページ：画像 */
    .pamphlet-img-wrap {
      width: 42%;
      flex-shrink: 0;
      overflow: hidden;
      position: relative;
    }

    .pamphlet-img {
      width: 100%;
      height: 100%;
      min-height: 220px;
      object-fit: cover;
      display: block;
      filter: sepia(0.12) contrast(1.04);
    }

    /* 折り目 */
    .pamphlet-fold {
      width: 1px;
      flex-shrink: 0;
      background: linear-gradient(to bottom,
        rgba(0,0,0,0.04),
        rgba(0,0,0,0.14) 40%,
        rgba(0,0,0,0.08) 70%,
        rgba(0,0,0,0.03)
      );
      box-shadow: 1px 0 4px rgba(0,0,0,0.07), -1px 0 2px rgba(255,255,255,0.4);
    }

    /* 右ページ：テキスト */
    .pamphlet-text {
      flex: 1;
      padding: 22px 20px 22px 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #111;
    }

    .pamphlet-heading {
      font-size: 8px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #bbb;
      margin-bottom: 10px;
    }

    .pamphlet-ex-title {
      font-family: 'Noto Serif JP', serif;
      font-size: 13px;
      font-weight: 400;
      color: #111;
      line-height: 1.7;
      letter-spacing: 0.03em;
    }

    .pamphlet-rule {
      height: 1px;
      background: linear-gradient(to right, rgba(0,0,0,0.15), transparent);
      margin: 12px 0;
    }

    .pamphlet-museum-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 11px;
      color: #555;
      letter-spacing: 0.1em;
    }

    .pamphlet-dates {
      font-family: 'Cormorant Garamond', serif;
      font-size: 12px;
      color: #c9a84c;
      letter-spacing: 0.1em;
      margin-top: 6px;
    }

    .pamphlet-copy {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 12px;
      color: #888;
      margin-top: 10px;
      line-height: 1.6;
    }

    /* ストーリー本文 */
    .pamphlet-story {
      font-family: 'Noto Serif JP', serif;
      font-size: 11.5px;
      font-weight: 300;
      color: #2a2a2a;
      line-height: 2.0;
      letter-spacing: 0.04em;
      flex: 1;
    }

    .pamphlet-story p {
      margin: 0;
    }

    .pamphlet-story p + p {
      margin-top: 1.1em;
    }

    .pamphlet-link {
      display: inline-block;
      margin-top: 16px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #333;
      text-decoration: none;
      border-bottom: 1px solid rgba(0,0,0,0.2);
      padding-bottom: 2px;
      transition: color 0.3s, border-color 0.3s;
      align-self: flex-start;
    }

    .pamphlet-link:hover {
      color: #c9a84c;
      border-color: rgba(201,168,76,0.5);
    }

    /* 空状態 */
    .empty {
      padding: 80px;
      text-align: center;
      font-size: 13px;
      letter-spacing: 0.15em;
      color: rgba(240,235,224,0.18);
    }

    /* フッター */
    .footer {
      padding: 40px 48px;
      border-top: 1px solid rgba(240,235,224,0.06);
      margin-top: 1px;
      text-align: center;
    }

    .footer-text {
      font-size: 10px;
      letter-spacing: 0.3em;
      color: rgba(240,235,224,0.12);
      text-transform: uppercase;
      font-style: italic;
    }

    @media (max-width: 480px) {
      .header   { padding: 24px 20px 20px; }
      .controls { padding: 14px 20px; }
      .page-title { font-size: 20px; }
    }
  </style>
</head>
<body>

  <header class="header">
    <div>
      <a href="index.html" class="logo-link">
        <div class="logo">MUnCh — Tokyo Exhibitions</div>
      </a>
      <div class="page-title">開催中の特別展</div>
    </div>
    <nav class="nav-tabs">
      <a href="list.html" class="nav-tab active">一覧</a>
      <a href="map.html"  class="nav-tab">地図</a>
    </nav>
  </header>

  <div class="controls">
    <span class="controls-label">Sort</span>
    <select id="sort" class="sort-select">
      <option value="end">終了が近い順</option>
      <option value="title">タイトル順</option>
      <option value="near">近い順</option>
      <option value="ueno">上野エリア</option>
    </select>
    <span class="count" id="count"></span>
  </div>

  <div id="status"></div>
  <div class="grid" id="list"></div>

  <footer class="footer">
    <div class="footer-text">東京の展覧会を、映画のように。</div>
  </footer>

  <script>
  const museumCoords = {
    "東京都美術館":               { lat: 35.7172, lng: 139.7765 },
    "東京国立近代美術館":          { lat: 35.6909, lng: 139.7544 },
    "東京藝術大学大学美術館":      { lat: 35.7188, lng: 139.7753 },
    "国立西洋美術館":              { lat: 35.7155, lng: 139.7757 },
    "上野の森美術館":              { lat: 35.7130, lng: 139.7736 },
    "東京都現代美術館":            { lat: 35.6817, lng: 139.8016 },
    "森美術館":                   { lat: 35.6604, lng: 139.7292 },
    "国立新美術館":                { lat: 35.6655, lng: 139.7279 },
    "サントリー美術館":            { lat: 35.6643, lng: 139.7310 },
    "東京国立博物館":              { lat: 35.7188, lng: 139.7764 },
    "江戸東京博物館":              { lat: 35.6966, lng: 139.7973 },
    "世田谷美術館":                { lat: 35.6321, lng: 139.5898 },
    "東京都写真美術館":            { lat: 35.6412, lng: 139.7133 },
    "アーティゾン美術館":          { lat: 35.6805, lng: 139.7680 },
    "パナソニック汐留美術館":      { lat: 35.6641, lng: 139.7590 },
    "三菱一号館美術館":            { lat: 35.6820, lng: 139.7638 },
    "SOMPO美術館":                { lat: 35.6896, lng: 139.6982 },
    "郷さくら美術館":              { lat: 35.6384, lng: 139.7101 },
    "根津美術館":                  { lat: 35.6599, lng: 139.7161 },
    "山種美術館":                  { lat: 35.6631, lng: 139.7203 },
    "畠山記念館":                  { lat: 35.6488, lng: 139.7344 },
    "五島美術館":                  { lat: 35.6185, lng: 139.6613 },
  };

  const defaultCoord = { lat: 35.6895, lng: 139.6917 };
  let exhibitions = [];
  let userLat = null, userLng = null;

  navigator.geolocation.getCurrentPosition(pos => {
    userLat = pos.coords.latitude;
    userLng = pos.coords.longitude;
    render();
  });

  function getDistance(lat1, lng1, lat2, lng2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLng = (lng2 - lng1) * Math.PI / 180;
    const a = Math.sin(dLat/2)**2 +
      Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLng/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  function toWalkTime(km) { return Math.round(km * 15); }

  function formatDate(s) {
    if (!s) return "—";
    const d = new Date(s);
    if (isNaN(d)) return s;
    return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")}`;
  }

  function daysUntil(dateStr) {
    if (!dateStr) return Infinity;
    return Math.ceil((new Date(dateStr) - new Date()) / 86400000);
  }

  function getCoord(name) { return museumCoords[name] || defaultCoord; }

  function getArea(name) {
    const ueno = ["東京都美術館","国立西洋美術館","東京国立博物館","上野の森美術館","東京藝術大学大学美術館","東京国立近代美術館"];
    return ueno.includes(name) ? "上野" : "その他";
  }

  async function fetchExhibitions() {
    try {
      const res = await fetch("exhibitions.json");
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const raw = await res.json();
      exhibitions = raw.map(e => ({ ...e, ...getCoord(e.museum), area: getArea(e.museum) }));
      render();
    } catch (err) {
      const el = document.getElementById("status");
      el.style.display = "block";
      el.textContent = `データ読み込み失敗: exhibitions.json が見つかりません`;
    }
  }

  function render() {
    const sortVal = document.getElementById("sort").value;
    const list    = document.getElementById("list");
    const now     = new Date();

    let data = exhibitions.filter(e => !e.end || new Date(e.end) >= now);

    if (sortVal === "end") {
      data.sort((a,b) => new Date(a.end||"9999") - new Date(b.end||"9999"));
    } else if (sortVal === "title") {
      data.sort((a,b) => a.title.localeCompare(b.title, "ja"));
    } else if (sortVal === "ueno") {
      data = data.filter(e => e.area === "上野");
    } else if (sortVal === "near" && userLat) {
      data.sort((a,b) => getDistance(userLat,userLng,a.lat,a.lng) - getDistance(userLat,userLng,b.lat,b.lng));
    }

    document.getElementById("count").textContent = `${data.length} exhibitions`;
    list.innerHTML = "";

    if (data.length === 0) {
      list.innerHTML = `<div class="empty">該当する展覧会が見つかりませんでした</div>`;
      return;
    }

    data.forEach((e, idx) => {
      const days     = daysUntil(e.end);
      const imgSrc   = (e.image_url && e.image_url !== "")
        ? e.image_url
        : `https://picsum.photos/seed/${encodeURIComponent(e.title)}/400/600`;
      const fallback = `https://picsum.photos/seed/${encodeURIComponent(e.museum)}/400/600`;
      const num      = String(idx + 1).padStart(4, "0");

      let distanceHtml = "";
      if (userLat && userLng) {
        const d = getDistance(userLat, userLng, e.lat, e.lng);
        distanceHtml = `<div class="card-distance">${d.toFixed(1)} km — 徒歩 ${toWalkTime(d)} 分</div>`;
      }

      const card = document.createElement("div");
      card.className = "card";
      card.style.position = "relative";
      card.innerHTML = `
        <a href="${e.url || '#'}" class="ticket-link" ${e.url ? 'target="_blank"' : ''}>
          <div class="ticket-img-wrap">
            <img class="ticket-img" src="${imgSrc}"
                 onerror="if(this.src!=='${fallback}')this.src='${fallback}'" alt="${e.title}">
          </div>
          <div class="ticket-body">
            <div>
              <div class="ticket-admit">Admit One — Special Exhibition</div>
              <div class="ticket-title">${e.title}</div>
              <div class="ticket-museum">${e.museum}</div>
              ${e.copy ? `<div class="ticket-copy">"${e.copy}"</div>` : ""}
            </div>
            <div class="ticket-dates">${formatDate(e.start)} — ${formatDate(e.end)}</div>
          </div>
          <div class="ticket-perf">
            <div class="perf-notch top"></div>
            <div class="perf-notch bottom"></div>
          </div>
          <div class="ticket-stub">
            <div class="stub-label">Viewing</div>
            <div class="stub-museum">${e.museum}</div>
            <div class="stub-number">No.${num}</div>
          </div>
        </a>
        ${days <= 7 ? `<div class="ticket-ending">Ending Soon</div>` : ""}
        ${distanceHtml}
        <div class="card-footer">
          <a href="https://www.google.com/maps/search/?api=1&query=${e.lat},${e.lng}" target="_blank">地図で見る</a>
          <a href="https://www.google.com/maps/dir/?api=1&destination=${e.lat},${e.lng}" target="_blank">ルート</a>
        </div>

        <!-- パンフレット -->
        <div class="pamphlet" id="pamphlet-${idx}">
          <div class="pamphlet-cover" onclick="togglePamphlet(${idx})">
            <span class="pamphlet-icon">◎</span>
            <span class="pamphlet-label-text">Pamphlet</span>
            <span class="pamphlet-chevron">›</span>
          </div>
          <div class="pamphlet-body">
            <div class="pamphlet-content">
              <div class="pamphlet-img-wrap">
                <img class="pamphlet-img" src="${imgSrc}"
                     onerror="if(this.src!=='${fallback}')this.src='${fallback}'" alt="${e.title}">
              </div>
              <div class="pamphlet-fold"></div>
              <div class="pamphlet-text">
                ${e.story
                  ? `<div class="pamphlet-story">${e.story.split("\n\n").map(p => `<p>${p}</p>`).join("")}</div>`
                  : `<div>
                      <div class="pamphlet-heading">Special Exhibition</div>
                      <div class="pamphlet-ex-title">${e.title}</div>
                      <div class="pamphlet-rule"></div>
                      <div class="pamphlet-museum-name">${e.museum}</div>
                      <div class="pamphlet-dates">${formatDate(e.start)} — ${formatDate(e.end)}</div>
                      ${e.copy ? `<div class="pamphlet-copy">"${e.copy}"</div>` : ""}
                    </div>`
                }
                ${e.url ? `<a href="${e.url}" target="_blank" class="pamphlet-link">公式サイトを見る</a>` : ""}
              </div>
            </div>
          </div>
        </div>
      `;
      list.appendChild(card);
    });
  }

  function togglePamphlet(idx) {
    document.getElementById(`pamphlet-${idx}`).classList.toggle("open");
  }

  document.getElementById("sort").addEventListener("change", render);
  fetchExhibitions();
  </script>

</body>
</html>
