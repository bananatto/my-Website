<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUnCh — Tokyo Exhibitions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Noto+Serif+JP:wght@300;400&display=swap" rel="stylesheet">

  <style>
    :root {
      --cream: #f0ebe0;
      --gold:  #c9a84c;
      --dark:  #0a0a0a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--dark);
      color: var(--cream);
      font-family: 'Cormorant Garamond', 'Noto Serif JP', serif;
      min-height: 100vh;
    }

    /* ヘッダー */
    .header {
      padding: 32px 48px 28px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 1px solid rgba(240,235,224,0.08);
    }

    .logo {
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: rgba(240,235,224,0.6);
    }

    .logo-link { text-decoration: none; }

    .page-title {
      font-size: 26px;
      font-weight: 300;
      font-style: italic;
      letter-spacing: 0.04em;
      color: var(--cream);
      margin-top: 6px;
    }

    /* タブナビ */
    .nav-tabs { display: flex; }

    .nav-tab {
      font-family: 'Cormorant Garamond', serif;
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: rgba(240,235,224,0.38);
      text-decoration: none;
      padding: 7px 18px;
      border: 1px solid rgba(240,235,224,0.14);
      transition: color 0.3s, background 0.3s, border-color 0.3s;
    }

    .nav-tab + .nav-tab { border-left: none; }

    .nav-tab.active {
      color: var(--cream);
      background: rgba(240,235,224,0.07);
      border-color: rgba(240,235,224,0.28);
    }

    .nav-tab:hover:not(.active) {
      color: var(--gold);
      border-color: rgba(201,168,76,0.35);
    }

    /* コントロール */
    .controls {
      padding: 18px 48px;
      display: flex;
      align-items: center;
      gap: 20px;
      border-bottom: 1px solid rgba(240,235,224,0.06);
    }

    .controls-label {
      font-size: 9px;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: rgba(240,235,224,0.45);
    }

    .sort-select {
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(240,235,224,0.18);
      color: var(--cream);
      font-family: 'Cormorant Garamond', serif;
      font-size: 14px;
      letter-spacing: 0.05em;
      padding: 2px 0;
      cursor: pointer;
      outline: none;
    }

    .sort-select option { background: #111; }

    .count {
      margin-left: auto;
      font-size: 10px;
      letter-spacing: 0.25em;
      color: rgba(240,235,224,0.2);
    }

    /* ステータス（エラー時のみ表示） */
    #status {
      display: none;
      padding: 16px 48px;
      font-size: 12px;
      letter-spacing: 0.05em;
      color: rgba(224,90,90,0.7);
    }

    /* チケットリスト */
    .grid {
      display: flex;
      flex-direction: column;
      gap: 24px;
      padding: 20px 0 40px;
    }

    /* カード外枠 */
    .card {
      background: var(--dark);
      border: 1px solid rgba(240,235,224,0.07);
    }

    /* チケット本体 */
    .ticket-link {
      display: flex;
      text-decoration: none;
      color: inherit;
      min-height: 130px;
      background: #f0ebe0;
      position: relative;
      transition: filter 0.3s;
      margin: 0 16px;
      border-radius: 2px;
      /* 紙テクスチャ */
      background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.72' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"),
        linear-gradient(160deg, #f5f0e8 0%, #ede8dc 60%, #f0ebe0 100%);
    }
    .ticket-link:hover { filter: brightness(1.03) contrast(1.01); }

    /* 左：画像 */
    .ticket-img-wrap {
      width: 90px;
      flex-shrink: 0;
      overflow: hidden;
    }

    .ticket-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: sepia(0.15) contrast(1.05);
      transition: filter 0.4s;
    }
    .ticket-link:hover .ticket-img { filter: sepia(0) contrast(1.1); }

    /* 中：本文 */
    .ticket-body {
      flex: 1;
      padding: 14px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #111;
    }

    .ticket-admit {
      font-size: 8px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #999;
    }

    .ticket-title {
      font-family: 'Noto Serif JP', serif;
      font-size: 14px;
      font-weight: 400;
      color: #111;
      line-height: 1.55;
      letter-spacing: 0.03em;
      margin-top: 7px;
    }

    .ticket-museum {
      font-family: 'Cormorant Garamond', serif;
      font-size: 12px;
      letter-spacing: 0.1em;
      color: #555;
      margin-top: 5px;
    }

    .ticket-copy {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 12px;
      color: #888;
      margin-top: 5px;
    }

    .ticket-dates {
      font-family: 'Cormorant Garamond', serif;
      font-size: 12px;
      letter-spacing: 0.1em;
      color: #333;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px dashed rgba(0,0,0,0.15);
    }

    /* ミシン目 */
    .ticket-perf {
      width: 14px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      background: #f0ebe0;
    }

    .ticket-perf::after {
      content: '';
      position: absolute;
      top: 8px;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      border-left: 1px dashed rgba(0,0,0,0.18);
    }

    .perf-notch {
      width: 14px;
      height: 7px;
      background: var(--dark);
      flex-shrink: 0;
      z-index: 1;
    }

    .perf-notch.top    { border-radius: 0 0 7px 7px; }
    .perf-notch.bottom { border-radius: 7px 7px 0 0; margin-top: auto; }

    /* 右：スタブ */
    .ticket-stub {
      width: 66px;
      flex-shrink: 0;
      background: #e5e0d5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 0;
    }

    .stub-label {
      writing-mode: vertical-rl;
      font-family: 'Cormorant Garamond', serif;
      font-size: 8px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #bbb;
    }

    .stub-museum {
      writing-mode: vertical-rl;
      font-family: 'Noto Serif JP', serif;
      font-size: 9px;
      letter-spacing: 0.08em;
      color: #777;
      max-height: 80px;
      overflow: hidden;
    }

    .stub-number {
      font-family: 'Cormorant Garamond', serif;
      font-size: 8px;
      color: #ccc;
      letter-spacing: 0.08em;
    }

    /* 終了間近スタンプ */
    .ticket-ending {
      position: absolute;
      bottom: 44px;
      right: 80px;
      font-size: 7px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(200,55,55,0.8);
      border: 1px solid rgba(200,55,55,0.35);
      padding: 3px 7px;
      transform: rotate(-4deg);
      pointer-events: none;
    }

    /* 距離・フッター */
    .card-distance {
      font-family: 'Cormorant Garamond', serif;
      font-size: 11px;
      color: rgba(240,235,224,0.38);
      padding: 6px 32px 4px;
      letter-spacing: 0.05em;
    }

    .card-footer {
      padding: 6px 32px 10px;
      display: flex;
      gap: 16px;
    }

    .card-footer a {
      font-family: 'Cormorant Garamond', serif;
      font-size: 11px;
      color: rgba(240,235,224,0.38);
      text-decoration: none;
      letter-spacing: 0.08em;
      transition: color 0.3s;
    }

    .card-footer a:hover { color: var(--gold); }

    /* ===== 本（パンフレット） ===== */
    .book {
      padding: 16px 16px 4px;
    }

    /* パネル：表紙と開いたページを同じ幅に包む */
    .book-panel {
      position: relative;
    }

    /* ===== ページめくりアニメーション（左右） ===== */
    @keyframes pageFlip {
      0%   { transform: perspective(800px) rotateY(0deg);    opacity: 1; }
      25%  { transform: perspective(800px) rotateY(-45deg);  opacity: 1; }
      50%  { transform: perspective(800px) rotateY(-90deg);  opacity: 0.6; }
      75%  { transform: perspective(800px) rotateY(-135deg); opacity: 0.2; }
      100% { transform: perspective(800px) rotateY(-180deg); opacity: 0; }
    }
    @keyframes pageFlipBack {
      0%   { transform: perspective(800px) rotateY(-180deg); opacity: 0; }
      50%  { transform: perspective(800px) rotateY(-90deg);  opacity: 0.5; }
      80%  { transform: perspective(800px) rotateY(-20deg);  opacity: 0.9; }
      100% { transform: perspective(800px) rotateY(0deg);    opacity: 1; }
    }
    /* パラパラ用 中間ページ */
    @keyframes pageFlipMid {
      0%   { transform: perspective(800px) rotateY(0deg);    opacity: 0; clip-path: none; }
      10%  { opacity: 0.7; }
      50%  { transform: perspective(800px) rotateY(-90deg);  opacity: 0.5; }
      90%  { opacity: 0.2; }
      100% { transform: perspective(800px) rotateY(-180deg); opacity: 0; }
    }
    @keyframes pageSheen {
      0%   { left: -100%; opacity: 0; }
      10%  { opacity: 0.9; }
      100% { left: 110%;  opacity: 0; }
    }

    /* 表紙ラッパー */
    .book-cover-wrap {
      overflow: visible;
      position: relative;
    }
    .book.open .book-cover-wrap {
      overflow: hidden;
      max-height: 0;
    }

    /* 表紙本体 */
    .book-cover {
      position: relative;
      height: 210px;
      overflow: hidden;
      cursor: pointer;
      user-select: none;
      transform-origin: left center;  /* 本の背（左端）を軸に右へめくる */
      transition: filter 0.25s;
      will-change: transform;
    }
    .book-cover:hover { filter: brightness(1.08) contrast(1.03); }

    /* めくり中の光沢シェーン */
    .book-cover::after {
      content: '';
      position: absolute;
      top: 0; bottom: 0;
      left: -100%; width: 50%;
      background: linear-gradient(to right,
        transparent 0%,
        rgba(255,255,255,0.08) 40%,
        rgba(255,255,255,0.22) 50%,
        rgba(255,255,255,0.08) 60%,
        transparent 100%);
      pointer-events: none;
      opacity: 0;
      z-index: 20;
    }
    .book-cover.flipping::after { animation: pageSheen 0.55s ease-in forwards; }
    .book-cover.flipping       { animation: pageFlip  0.55s cubic-bezier(0.4,0,0.55,1) forwards; }
    .book-cover.flipping-back  { animation: pageFlipBack 0.48s cubic-bezier(0.2,0,0.38,1) forwards; }

    /* パラパラ用 幽霊ページ（2枚） */
    .book-flip-ghost {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 15;
      transform-origin: left center;
      opacity: 0;
      background: linear-gradient(160deg, #f0ebe0, #e8e3d8);
    }
    .book-flip-ghost--1 { animation-delay: 0.08s; }
    .book-flip-ghost--2 { animation-delay: 0.16s; }
    .book-cover.flipping .book-flip-ghost { animation: pageFlipMid 0.55s ease-in forwards; }

    /* 表紙背景画像 */
    .book-cover-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center 20%;
      filter: sepia(0.10) contrast(1.08) brightness(0.95) saturate(1.05);
      transition: transform 0.5s ease;
    }
    .book-cover:hover .book-cover-bg { transform: scale(1.04); }

    /* グラデーションオーバーレイ（下に向かって暗く） */
    .book-cover-overlay {
      position: absolute;
      inset: 0;
      /* background はテーマごとにインライン */
    }

    /* 内側装飾ボーダー */
    .book-cover-inner-border {
      position: absolute;
      inset: 10px;
      pointer-events: none;
      z-index: 2;
    }

    /* テキストコンテンツ */
    .book-cover-content {
      position: relative;
      z-index: 3;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 0 22px 18px;
    }
    .book-cover-label {
      font-family: 'Cormorant Garamond', serif;
      font-size: 8px;
      letter-spacing: 0.36em;
      text-transform: uppercase;
      margin-bottom: 9px;
    }
    .book-cover-main-title {
      font-family: 'Noto Serif JP', serif;
      font-size: 16px;
      font-weight: 400;
      line-height: 1.6;
      letter-spacing: 0.04em;
      color: #fff;
      text-shadow: 0 1px 8px rgba(0,0,0,0.7), 0 2px 24px rgba(0,0,0,0.5);
      margin-bottom: 10px;
    }
    .book-cover-divider {
      height: 1px;
      width: 36px;
      margin-bottom: 9px;
      opacity: 0.8;
    }
    .book-cover-museum {
      font-family: 'Cormorant Garamond', serif;
      font-size: 11px;
      letter-spacing: 0.14em;
      color: rgba(255,255,255,0.72);
      text-shadow: 0 1px 6px rgba(0,0,0,0.8);
      margin-bottom: 2px;
    }
    .book-cover-dates {
      font-family: 'Cormorant Garamond', serif;
      font-size: 10px;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,0.52);
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    }
    .book-cover-hint {
      position: absolute;
      z-index: 3;
      top: 14px; right: 16px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 9px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.28);
      display: flex; align-items: center; gap: 5px;
      transition: color 0.25s;
    }
    .book-cover:hover .book-cover-hint { color: rgba(255,255,255,0.55); }

    /* ========== 形状テーマ（形を強調・四角背景を隠す） ========== */

    /* すべての形状ラッパーの共通スタイル */
    .book-cover-wrap {
      padding: 10px 0 14px;
    }

    /* ===== パネル幅クラス（表紙・ページ共通） ===== */
    .bc-panel-portrait  { width: 54%; margin: 0 auto; }
    .bc-panel-oval      { width: 82%; margin: 0 auto; }
    /* kakemono / vinyl / hex / crt は既存 wrapClass がそのままパネルに適用 */

    /* 1: ポートレートフレーム（ワイエス） ─ 絵画の額縁風 */
    .bc-portrait {
      width: 100%;
      height: 230px;
      box-shadow:
        0 0 0 5px #0a0a0a,
        0 0 0 7px rgba(143,176,204,0.35),
        0 0 0 13px #0a0a0a,
        0 0 0 15px rgba(143,176,204,0.15),
        0 12px 40px rgba(0,0,0,0.7);
    }
    .bc-portrait .book-cover-inner-border {
      inset: 8px;
      border: 1px solid rgba(143,176,204,0.30);
    }

    /* 2: 鳥居アーチ（加賀前田家） */
    .bc-arch {
      border-radius: 50% 50% 0 0 / 30% 30% 0 0;
      box-shadow: 0 -2px 0 0 var(--dark), 0 10px 40px rgba(0,0,0,0.65);
    }
    .bc-arch .book-cover-inner-border {
      inset: 10px;
      border: 1px solid rgba(201,168,76,0.32);
      border-radius: 46% 46% 0 0 / 26% 26% 0 0;
    }

    /* 3: 波形底辺（北斎） ─ drop-shadowで形に沿う */
    .bc-wave {
      clip-path: polygon(0 0,100% 0,100% 83%,97.5% 88%,95% 83%,92.5% 89%,90% 83%,87.5% 89%,85% 83%,82.5% 89%,80% 83%,77.5% 89%,75% 83%,72.5% 89%,70% 83%,67.5% 89%,65% 83%,62.5% 89%,60% 83%,57.5% 89%,55% 83%,52.5% 89%,50% 83%,47.5% 89%,45% 83%,42.5% 89%,40% 83%,37.5% 89%,35% 83%,32.5% 89%,30% 83%,27.5% 89%,25% 83%,22.5% 89%,20% 83%,17.5% 89%,15% 83%,12.5% 89%,10% 83%,7.5% 89%,5% 83%,2.5% 89%,0 83%);
      filter: drop-shadow(0 8px 18px rgba(0,0,0,0.8));
    }
    .bc-wave .book-cover-inner-border {
      inset: 8px 8px 28px;
      border: 1px solid rgba(104,136,208,0.28);
    }

    /* 4: 楕円（モネ） ─ 浮かぶパレット */
    .bc-oval {
      width: 100%;
      height: 215px;
      border-radius: 50%;
      box-shadow:
        0 0 0 3px rgba(122,188,160,0.25),
        0 12px 44px rgba(0,0,0,0.65),
        0 0 60px rgba(122,188,160,0.08);
    }
    .bc-oval .book-cover-inner-border {
      border: 1px solid rgba(122,188,160,0.28);
      border-radius: 50%;
      inset: 8px;
    }

    /* 5: 掛け軸（観山） ─ 軸棒が本物らしい */
    .bc-kakemono-wrap {
      padding: 4px 26% 14px;
    }
    .bc-kakemono {
      height: 230px;
      box-shadow: 3px 0 12px rgba(0,0,0,0.5), -3px 0 12px rgba(0,0,0,0.5);
    }
    .bc-kakemono-roller {
      position: relative;
      z-index: 5;
      height: 16px;
      background:
        linear-gradient(to bottom,
          rgba(255,255,255,0.08) 0%,
          #5a4030 20%,
          #3a2818 50%,
          #5a4030 80%,
          rgba(0,0,0,0.3) 100%
        );
      border-radius: 8px;
      box-shadow:
        0 3px 10px rgba(0,0,0,0.8),
        inset 0 1px 0 rgba(255,255,255,0.12),
        inset 0 -1px 0 rgba(0,0,0,0.3);
    }
    .bc-kakemono .book-cover-inner-border {
      border-top: 1px solid rgba(192,184,176,0.25);
      border-bottom: 1px solid rgba(192,184,176,0.25);
      border-left: none; border-right: none;
      inset: 0 10px;
    }

    /* 6: 破れた紙（テートYBA） ─ drop-shadowで輪郭を強調 */
    .bc-torn {
      clip-path: polygon(0 0,100% 0,100% 65%,98% 69%,100% 73%,97% 77%,100% 81%,97% 85%,100% 89%,96% 93%,100% 97%,93% 95%,87% 100%,81% 93%,75% 100%,69% 93%,63% 100%,57% 93%,51% 100%,45% 93%,39% 100%,33% 93%,27% 100%,21% 93%,15% 100%,9% 93%,3% 100%,0 97%);
      filter: drop-shadow(0 8px 20px rgba(0,0,0,0.85));
    }
    .bc-torn .book-cover-inner-border {
      inset: 8px 8px 50px;
      border: 1px solid rgba(224,48,48,0.28);
    }

    /* 7: LPレコード（ロン・ミュエク） ─ 盤面の写実 */
    .bc-vinyl-wrap {
      padding: 4px 8% 16px;
    }
    .bc-vinyl {
      width: min(210px,60vw);
      height: min(210px,60vw);
      border-radius: 50%;
      overflow: hidden;
      margin: 0 auto;
      box-shadow:
        0 0 0 2px rgba(240,235,224,0.07),
        0 14px 44px rgba(0,0,0,0.75),
        inset 0 0 30px rgba(0,0,0,0.4);
    }
    .bc-vinyl-groove {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: repeating-radial-gradient(
        circle at center,
        transparent 0px,   transparent 7px,
        rgba(0,0,0,0.22)   7px, rgba(0,0,0,0.22) 8px,
        transparent 8px,   transparent 11px,
        rgba(0,0,0,0.12)  11px, rgba(0,0,0,0.12) 12px
      );
      z-index: 1;
    }
    /* レコードの反射光 */
    .bc-vinyl::before {
      content: '';
      position: absolute;
      top: 4%; left: 10%;
      width: 35%; height: 45%;
      background: radial-gradient(ellipse, rgba(255,255,255,0.07) 0%, transparent 70%);
      border-radius: 50%;
      z-index: 3;
      pointer-events: none;
    }
    .bc-vinyl-label {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      width: 40%; height: 40%;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, #3a2510 0%, #1c0e04 70%);
      border: 1px solid rgba(201,168,76,0.4);
      box-shadow: inset 0 0 8px rgba(0,0,0,0.5);
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .bc-vinyl-label-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 7px;
      font-weight: 400;
      color: rgba(201,168,76,0.85);
      text-align: center;
      letter-spacing: 0.12em;
      line-height: 1.6;
    }
    .bc-vinyl-hole {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      width: 13px; height: 13px;
      border-radius: 50%;
      background: radial-gradient(circle, #1a1410, #0a0a0a);
      z-index: 5;
      box-shadow:
        0 0 0 1.5px rgba(255,255,255,0.12),
        inset 0 1px 2px rgba(0,0,0,0.8);
    }
    .bc-vinyl .book-cover-content { display: none; }
    .bc-vinyl .book-cover-hint {
      top: auto; bottom: 12%;
      right: 50%; transform: translateX(50%);
      z-index: 6;
    }

    /* 8: 平行四辺形（新版画） ─ drop-shadowで輪郭 */
    .bc-slant {
      clip-path: polygon(7% 0,100% 0,93% 100%,0 100%);
      filter: drop-shadow(0 6px 20px rgba(0,0,0,0.8));
    }
    .bc-slant .book-cover-inner-border {
      inset: 8px;
      border: 1px solid rgba(200,128,64,0.28);
    }

    /* 9: ブラウン管テレビ（暁斎） ─ TVボディを写実的に */
    .bc-crt-wrap {
      padding: 0 5% 28px;
    }
    .bc-crt {
      border-radius: 14% 14% 10% 10% / 8% 8% 6% 6%;
      box-shadow:
        0 0 0 8px #180808,
        0 0 0 11px #230e0e,
        0 0 0 12px #110505,
        0 14px 40px rgba(0,0,0,0.8);
      overflow: visible;
    }
    /* スクリーンのベゼル内側に反射光 */
    .bc-crt::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 13% 13% 9% 9% / 7% 7% 5% 5%;
      background: linear-gradient(140deg,
        rgba(255,255,255,0.06) 0%,
        transparent 45%);
      z-index: 8;
      pointer-events: none;
    }
    .bc-crt .book-cover-bg   { border-radius: 13% 13% 9% 9% / 7% 7% 5% 5%; }
    .bc-crt .book-cover-overlay { border-radius: 13% 13% 9% 9% / 7% 7% 5% 5%; }
    .bc-crt .book-cover-inner-border {
      inset: 12px;
      border: 2px solid rgba(192,40,32,0.30);
      border-radius: 10% 10% 7% 7% / 6% 6% 4% 4%;
    }
    .bc-crt-antenna {
      position: absolute;
      bottom: 100%;
      width: 4px;
      height: 44px;
      background: linear-gradient(to top,
        #1a0808 0%, #2e1212 40%, #1e0e0e 100%);
      border-radius: 2px 2px 0 0;
      z-index: 10;
      transform-origin: bottom center;
      box-shadow: 1px 0 3px rgba(0,0,0,0.5);
    }
    .bc-crt-antenna--l { left: 26%; transform: rotate(-20deg); }
    .bc-crt-antenna--r { right: 26%; transform: rotate(20deg); }
    .bc-crt-knobs {
      position: absolute;
      bottom: -22px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 10;
    }
    .bc-crt-knob {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%,
        #3a1010 0%, #1a0505 100%);
      border: 1px solid #2a0808;
      box-shadow:
        0 2px 5px rgba(0,0,0,0.9),
        inset 0 1px 0 rgba(255,255,255,0.06);
    }

    /* 10: 六角形（エリック・カール） ─ drop-shadowで輪郭 */
    .bc-hex-wrap {
      padding: 6px 6% 16px;
    }
    .bc-hex {
      clip-path: polygon(25% 0%,75% 0%,100% 50%,75% 100%,25% 100%,0% 50%);
      height: 220px;
      filter: drop-shadow(0 6px 22px rgba(0,0,0,0.75));
    }
    .bc-hex .book-cover-inner-border {
      border: 2px solid rgba(80,184,104,0.30);
      clip-path: polygon(26% 3%,74% 3%,97% 50%,74% 97%,26% 97%,3% 50%);
      inset: 0;
    }

    /* 開閉アニメーション */
    .book-body {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.5s cubic-bezier(0.16,1,0.3,1);
      overflow: hidden;
    }

    .book.open .book-body { grid-template-rows: 1fr; }

    /* 開いたページ（両開き） */
    .book-spread {
      overflow: hidden;
      min-height: 0;
      height: 210px;
      display: flex;
      box-shadow:
        inset 0 8px 20px rgba(0,0,0,0.25),
        inset 0 -4px 12px rgba(0,0,0,0.10);
    }

    /* カバー形状ごとの高さオーバーライド */
    .bc-panel-portrait .book-spread { height: 230px; }
    .bc-panel-oval     .book-spread { height: 215px; }
    .bc-kakemono-wrap  .book-spread { height: 230px; }

    /* 左ページ：画像 */
    .book-left {
      width: 42%;
      flex-shrink: 0;
      overflow: hidden;
      position: relative;
      background: #111;
    }
    .book-left img {
      width: 100%;
      height: 100%;
      min-height: 0;
      object-fit: cover;
      display: block;
      filter: sepia(0.15) contrast(1.06) brightness(0.97);
    }
    /* 左ページ下の印刷情報 */
    .book-left-footer {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 18px 14px 10px;
      background: linear-gradient(to top, rgba(0,0,0,0.55) 0%, transparent 100%);
    }

    /* ページ番号（左ページ下） */
    .book-left-folio {
      font-family: 'Cormorant Garamond', serif;
      font-size: 9px;
      letter-spacing: 0.2em;
      color: rgba(240,235,224,0.5);
      text-align: center;
    }

    /* 背の折り目（ガター） ─ 写実的な綴じ目 */
    .book-gutter {
      width: 22px;
      flex-shrink: 0;
      position: relative;
      background: linear-gradient(to right,
        rgba(0,0,0,0.32) 0%,
        rgba(0,0,0,0.14) 20%,
        rgba(255,255,255,0.12) 35%,
        rgba(255,255,255,0.28) 50%,
        rgba(255,255,255,0.08) 65%,
        rgba(0,0,0,0.08) 80%,
        rgba(0,0,0,0.03) 100%
      );
      box-shadow:
        -3px 0 8px rgba(0,0,0,0.20),
         4px 0 10px rgba(0,0,0,0.12);
    }
    /* ガターの縦の綴じ糸ライン */
    .book-gutter::before {
      content: '';
      position: absolute;
      left: 50%; top: 0; bottom: 0;
      width: 1px;
      background: linear-gradient(to bottom,
        transparent,
        rgba(0,0,0,0.08) 15%,
        rgba(0,0,0,0.12) 50%,
        rgba(0,0,0,0.08) 85%,
        transparent
      );
    }

    /* 右ページ：ストーリー ─ リアルな紙の質感 */
    .book-right {
      flex: 1;
      padding: 16px 16px 14px 14px;
      display: flex;
      flex-direction: column;
      color: #1a1410;
      position: relative;
      overflow: hidden;
      /* 多層の紙テクスチャ */
      background-color: #f3ede0;
      background-image:
        /* 細かいノイズグレイン */
        url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E"),
        /* 左端のガター影 */
        linear-gradient(to right, rgba(0,0,0,0.07) 0%, rgba(0,0,0,0.02) 12%, transparent 30%),
        /* 右端の微妙な暗み */
        linear-gradient(to left, rgba(0,0,0,0.04) 0%, transparent 20%),
        /* 上端の影（本を開いたときの影） */
        linear-gradient(to bottom, rgba(0,0,0,0.05) 0%, transparent 8%),
        /* 下端の影（ページが丸まる感じ） */
        linear-gradient(to top, rgba(0,0,0,0.06) 0%, transparent 10%),
        /* 紙の色の微妙なグラデーション */
        linear-gradient(155deg, #f8f3e8 0%, #f3ede0 40%, #ede7d8 75%, #e8e1d4 100%);
    }
    /* ページ右端のページ断面（積み重なった紙の厚み） */
    .book-right::after {
      content: '';
      position: absolute;
      top: 3px; bottom: 3px; right: 0;
      width: 4px;
      background: repeating-linear-gradient(
        to bottom,
        rgba(180,160,120,0.12) 0px,
        rgba(180,160,120,0.12) 1px,
        rgba(220,200,170,0.06) 1px,
        rgba(220,200,170,0.06) 3px
      );
      pointer-events: none;
    }

    /* ページ上部の装飾罫 */
    .book-right-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      padding-bottom: 9px;
      border-bottom: 1px solid rgba(100,80,50,0.15);
    }
    .book-right-header-rule {
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, rgba(100,80,50,0.15), transparent);
    }
    .book-right-header-label {
      font-family: 'Cormorant Garamond', serif;
      font-size: 8px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(160,120,60,0.75);
    }

    /* ストーリー本文 */
    .pamphlet-story {
      font-family: 'Noto Serif JP', serif;
      font-size: 11px;
      font-weight: 300;
      color: #2a2a2a;
      line-height: 1.9;
      letter-spacing: 0.04em;
      flex: 1;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(201,168,76,0.3) transparent;
    }

    .pamphlet-story p { margin: 0; }
    .pamphlet-story p + p { margin-top: 1.1em; }

    /* ページ番号（右ページ下） */
    .book-right-folio {
      font-family: 'Cormorant Garamond', serif;
      font-size: 9px;
      letter-spacing: 0.2em;
      color: rgba(0,0,0,0.22);
      text-align: right;
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px solid rgba(0,0,0,0.08);
    }

    .pamphlet-link {
      display: inline-block;
      margin-top: 12px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #333;
      text-decoration: none;
      border-bottom: 1px solid rgba(0,0,0,0.2);
      padding-bottom: 2px;
      transition: color 0.3s, border-color 0.3s;
      align-self: flex-start;
    }

    .pamphlet-link:hover {
      color: #c9a84c;
      border-color: rgba(201,168,76,0.5);
    }

    /* 閉じるボタン */
    .book-close-btn {
      display: none;
      font-family: 'Cormorant Garamond', serif;
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(0,0,0,0.38);
      background: none;
      border: 1px solid rgba(0,0,0,0.15);
      padding: 4px 10px;
      cursor: pointer;
      margin-top: 12px;
      align-self: flex-end;
      transition: color 0.2s, border-color 0.2s;
    }
    .book-close-btn:hover {
      color: rgba(0,0,0,0.65);
      border-color: rgba(0,0,0,0.3);
    }
    .book.open .book-close-btn { display: block; }

    /* カウントダウンバッジ */
    .ticket-countdown {
      position: absolute;
      top: 8px; left: 8px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 9px;
      letter-spacing: 0.18em;
      background: rgba(201,168,76,0.15);
      color: var(--gold);
      border: 1px solid rgba(201,168,76,0.3);
      padding: 2px 7px;
    }
    .ticket-countdown.urgent {
      background: rgba(200,55,55,0.15);
      color: rgba(220,80,80,0.9);
      border-color: rgba(200,55,55,0.3);
    }

    /* 空状態 */
    .empty {
      padding: 80px;
      text-align: center;
      font-size: 13px;
      letter-spacing: 0.15em;
      color: rgba(240,235,224,0.18);
    }

    /* フッター */
    .footer {
      padding: 40px 48px;
      border-top: 1px solid rgba(240,235,224,0.06);
      margin-top: 1px;
      text-align: center;
    }

    .footer-text {
      font-size: 10px;
      letter-spacing: 0.3em;
      color: rgba(240,235,224,0.12);
      text-transform: uppercase;
      font-style: italic;
    }

    /* 検索バー */
    .search-input {
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(240,235,224,0.18);
      color: var(--cream);
      font-family: 'Cormorant Garamond', serif;
      font-size: 14px;
      letter-spacing: 0.05em;
      padding: 2px 0;
      outline: none;
      width: 200px;
      transition: border-color 0.3s;
    }
    .search-input::placeholder {
      color: rgba(240,235,224,0.28);
      font-style: italic;
    }
    .search-input:focus {
      border-bottom-color: rgba(201,168,76,0.55);
    }

    /* お気に入りボタン */
    .fav-btn {
      position: absolute;
      top: -8px;
      right: -8px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 1px solid rgba(201,168,76,0.35);
      background: rgba(10,10,10,0.72);
      color: rgba(201,168,76,0.45);
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: color 0.25s, background 0.25s, border-color 0.25s, transform 0.15s;
      backdrop-filter: blur(4px);
    }
    .fav-btn:hover {
      color: var(--gold);
      border-color: rgba(201,168,76,0.7);
      background: rgba(10,10,10,0.88);
      transform: scale(1.12);
    }
    .fav-btn.active {
      color: var(--gold);
      border-color: rgba(201,168,76,0.65);
      background: rgba(20,15,5,0.85);
    }

    /* 訪問済みボタン */
    .visited-btn {
      position: absolute;
      top: -8px;
      right: 28px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 1px solid rgba(240,235,224,0.22);
      background: rgba(10,10,10,0.72);
      color: rgba(240,235,224,0.30);
      font-size: 13px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: color 0.25s, background 0.25s, border-color 0.25s, transform 0.15s;
      backdrop-filter: blur(4px);
    }
    .visited-btn:hover {
      color: rgba(240,235,224,0.75);
      border-color: rgba(240,235,224,0.50);
      background: rgba(10,10,10,0.88);
      transform: scale(1.12);
    }
    .visited-btn.active {
      color: rgba(180,220,180,0.85);
      border-color: rgba(140,200,140,0.55);
      background: rgba(10,20,10,0.85);
    }

    /* 訪問済みカードの視覚表現 */
    .card.visited .ticket-link {
      filter: sepia(0.55) opacity(0.62);
    }
    .card.visited .ticket-link:hover {
      filter: sepia(0.35) opacity(0.78) brightness(1.04);
    }

    /* URLコピーボタン */
    .copy-link-btn {
      font-family: 'Cormorant Garamond', serif;
      font-size: 11px;
      color: rgba(240,235,224,0.38);
      letter-spacing: 0.08em;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      transition: color 0.3s;
    }
    .copy-link-btn:hover { color: var(--gold); }
    .copy-link-btn.copied {
      color: rgba(140,200,140,0.75);
    }

    /* ===== カード登場アニメーション ===== */
    @keyframes cardEntrance {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .card {
      animation: cardEntrance 0.5s ease forwards;
    }

    /* ===== パンフレット表紙 hint 点滅 ===== */
    @keyframes hintPulse {
      0%, 100% { opacity: 0.28; }
      50%       { opacity: 0.65; }
    }
    .book-cover-hint {
      animation: hintPulse 2.4s ease-in-out infinite;
    }
    .book-cover:hover .book-cover-hint { animation: none; opacity: 0.55; }

    @media (max-width: 480px) {
      .header   { padding: 24px 20px 20px; }
      .controls { padding: 14px 16px; flex-wrap: wrap; }
      .page-title { font-size: 20px; }
      .search-input { width: 100%; }
      #search { width: 100%; }
      .ticket-link { margin: 0 8px; }
      .ticket-stub { width: 50px; }
      .ticket-img-wrap { width: 70px; }
      .book { padding: 10px 8px 4px; }
      .card-distance { padding-left: 16px; padding-right: 16px; }
      .card-footer   { padding-left: 16px; padding-right: 16px; }
    }
  </style>
</head>
<body>

  <header class="header">
    <div>
      <a href="index.html" class="logo-link">
        <div class="logo">MUnCh — Tokyo Exhibitions</div>
      </a>
      <div class="page-title">開催中の特別展</div>
    </div>
    <nav class="nav-tabs">
      <a href="list.html" class="nav-tab active">一覧</a>
      <a href="map.html"  class="nav-tab">地図</a>
    </nav>
  </header>

  <div class="controls">
    <span class="controls-label">Sort</span>
    <select id="sort" class="sort-select">
      <option value="end">終了が近い順</option>
      <option value="title">タイトル順</option>
      <option value="near">近い順</option>
      <option value="ueno">上野エリア</option>
      <option value="favs">お気に入りのみ</option>
    </select>
    <input id="search" class="search-input" type="text" placeholder="タイトル・美術館で検索…" autocomplete="off">
    <span class="count" id="count"></span>
  </div>

  <div id="status"></div>
  <div class="grid" id="list"></div>

  <footer class="footer">
    <div class="footer-text">東京の展覧会を、映画のように。</div>
  </footer>

  <script>
  const museumCoords = {
    "東京都美術館":               { lat: 35.7172, lng: 139.7765 },
    "東京国立近代美術館":          { lat: 35.6909, lng: 139.7544 },
    "東京藝術大学大学美術館":      { lat: 35.7188, lng: 139.7753 },
    "国立西洋美術館":              { lat: 35.7155, lng: 139.7757 },
    "上野の森美術館":              { lat: 35.7130, lng: 139.7736 },
    "東京都現代美術館":            { lat: 35.6817, lng: 139.8016 },
    "森美術館":                   { lat: 35.6604, lng: 139.7292 },
    "国立新美術館":                { lat: 35.6655, lng: 139.7279 },
    "サントリー美術館":            { lat: 35.6643, lng: 139.7310 },
    "東京国立博物館":              { lat: 35.7188, lng: 139.7764 },
    "江戸東京博物館":              { lat: 35.6966, lng: 139.7973 },
    "世田谷美術館":                { lat: 35.6321, lng: 139.5898 },
    "東京都写真美術館":            { lat: 35.6412, lng: 139.7133 },
    "アーティゾン美術館":          { lat: 35.6805, lng: 139.7680 },
    "パナソニック汐留美術館":      { lat: 35.6641, lng: 139.7590 },
    "三菱一号館美術館":            { lat: 35.6820, lng: 139.7638 },
    "SOMPO美術館":                { lat: 35.6896, lng: 139.6982 },
    "郷さくら美術館":              { lat: 35.6384, lng: 139.7101 },
    "根津美術館":                  { lat: 35.6599, lng: 139.7161 },
    "山種美術館":                  { lat: 35.6631, lng: 139.7203 },
    "畠山記念館":                  { lat: 35.6488, lng: 139.7344 },
    "五島美術館":                  { lat: 35.6185, lng: 139.6613 },
  };

  const defaultCoord = { lat: 35.6895, lng: 139.6917 };
  let exhibitions = [];
  let userLat = null, userLng = null;

  navigator.geolocation.getCurrentPosition(pos => {
    userLat = pos.coords.latitude;
    userLng = pos.coords.longitude;
    render();
  });

  function getDistance(lat1, lng1, lat2, lng2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLng = (lng2 - lng1) * Math.PI / 180;
    const a = Math.sin(dLat/2)**2 +
      Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLng/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  function toWalkTime(km) { return Math.round(km * 15); }

  function formatDate(s) {
    if (!s) return "—";
    const d = new Date(s);
    if (isNaN(d)) return s;
    return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")}`;
  }

  function daysUntil(dateStr) {
    if (!dateStr) return Infinity;
    return Math.ceil((new Date(dateStr) - new Date()) / 86400000);
  }

  function getCoord(name) { return museumCoords[name] || defaultCoord; }

  function getArea(name) {
    const ueno = ["東京都美術館","国立西洋美術館","東京国立博物館","上野の森美術館","東京藝術大学大学美術館","東京国立近代美術館"];
    return ueno.includes(name) ? "上野" : "その他";
  }

  async function fetchExhibitions() {
    try {
      const res = await fetch("exhibitions.json");
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const raw = await res.json();
      exhibitions = raw.map(e => ({ ...e, ...getCoord(e.museum), area: getArea(e.museum) }));
      render();
    } catch (err) {
      const el = document.getElementById("status");
      el.style.display = "block";
      el.textContent = `データ読み込み失敗: exhibitions.json が見つかりません`;
    }
  }

  /* ===== お気に入り（localStorage） ===== */
  function getFavs() {
    try { return JSON.parse(localStorage.getItem("munch_favs") || "{}"); }
    catch { return {}; }
  }
  function setFav(id, val) {
    const favs = getFavs();
    if (val) favs[id] = true;
    else delete favs[id];
    localStorage.setItem("munch_favs", JSON.stringify(favs));
  }

  /* ===== 訪問済み（localStorage） ===== */
  function getVisited() {
    try { return JSON.parse(localStorage.getItem("munch_visited") || "{}"); }
    catch { return {}; }
  }
  function setVisited(id, val) {
    const visited = getVisited();
    if (val) visited[id] = true;
    else delete visited[id];
    localStorage.setItem("munch_visited", JSON.stringify(visited));
  }

  function render() {
    const sortVal   = document.getElementById("sort").value;
    const searchVal = document.getElementById("search").value.trim().toLowerCase();
    const list      = document.getElementById("list");
    const now       = new Date();

    let data = exhibitions.filter(e => !e.end || new Date(e.end) >= now);

    // キーワードフィルタ
    if (searchVal) {
      data = data.filter(e =>
        (e.title  || "").toLowerCase().includes(searchVal) ||
        (e.museum || "").toLowerCase().includes(searchVal) ||
        (e.copy   || "").toLowerCase().includes(searchVal)
      );
    }

    if (sortVal === "end") {
      data.sort((a,b) => new Date(a.end||"9999") - new Date(b.end||"9999"));
    } else if (sortVal === "title") {
      data.sort((a,b) => a.title.localeCompare(b.title, "ja"));
    } else if (sortVal === "ueno") {
      data = data.filter(e => e.area === "上野");
    } else if (sortVal === "near" && userLat) {
      data.sort((a,b) => getDistance(userLat,userLng,a.lat,a.lng) - getDistance(userLat,userLng,b.lat,b.lng));
    } else if (sortVal === "favs") {
      const favs = getFavs();
      data = data.filter(e => !!favs[`${e.title}__${e.museum}`]);
    }

    document.getElementById("count").textContent = `${data.length} exhibitions`;
    list.innerHTML = "";

    if (data.length === 0) {
      list.innerHTML = `<div class="empty">該当する展覧会が見つかりませんでした</div>`;
      return;
    }

    data.forEach((e, idx) => {
      const days     = daysUntil(e.end);
      const imgSrc   = (e.image_url && e.image_url !== "")
        ? e.image_url
        : `https://picsum.photos/seed/${encodeURIComponent(e.title)}/400/600`;
      const fallback = `https://picsum.photos/seed/${encodeURIComponent(e.museum)}/400/600`;
      const num      = String(idx + 1).padStart(4, "0");

      let distanceHtml = "";
      if (userLat && userLng) {
        const d = getDistance(userLat, userLng, e.lat, e.lng);
        distanceHtml = `<div class="card-distance">${d.toFixed(1)} km — 徒歩 ${toWalkTime(d)} 分</div>`;
      }

      const favId    = `${e.title}__${e.museum}`;
      const favs     = getFavs();
      const isFav    = !!favs[favId];
      const visited  = getVisited();
      const isVisited = !!visited[favId];

      const card = document.createElement("div");
      card.className = `card${isVisited ? ' visited' : ''}`;
      card.style.position = "relative";
      card.innerHTML = `
        <button class="fav-btn${isFav ? ' active' : ''}" data-fav-id="${favId}" aria-label="お気に入り">${isFav ? '♥' : '♡'}</button>
        <button class="visited-btn${isVisited ? ' active' : ''}" data-visited-id="${favId}" aria-label="訪問済み">${isVisited ? '✓' : '✓'}</button>
        <a href="${e.url || '#'}" class="ticket-link" ${e.url ? 'target="_blank"' : ''}>
          <div class="ticket-img-wrap">
            <img class="ticket-img" src="${imgSrc}"
                 onerror="if(this.src!=='${fallback}')this.src='${fallback}'" alt="${e.title}">
          </div>
          <div class="ticket-body">
            <div>
              <div class="ticket-admit">Admit One — Special Exhibition</div>
              <div class="ticket-title">${e.title}</div>
              <div class="ticket-museum">${e.museum}</div>
              ${e.copy ? `<div class="ticket-copy">"${e.copy}"</div>` : ""}
            </div>
            <div class="ticket-dates">${formatDate(e.start)} — ${formatDate(e.end)}</div>
          </div>
          <div class="ticket-perf">
            <div class="perf-notch top"></div>
            <div class="perf-notch bottom"></div>
          </div>
          <div class="ticket-stub">
            <div class="stub-label">Viewing</div>
            <div class="stub-museum">${e.museum}</div>
            <div class="stub-number">No.${num}</div>
          </div>
        </a>
        ${days <= 30 ? `<div class="ticket-countdown${days <= 7 ? ' urgent' : ''}">あと${days}日</div>` : ""}
        ${days <= 7 ? `<div class="ticket-ending">Ending Soon</div>` : ""}
        ${distanceHtml}
        <div class="card-footer">
          <a href="https://www.google.com/maps/search/?api=1&query=${e.lat},${e.lng}" target="_blank">地図で見る</a>
          <a href="https://www.google.com/maps/dir/?api=1&destination=${e.lat},${e.lng}" target="_blank">ルート</a>
          ${e.url ? `<button class="copy-link-btn" data-copy-url="${e.url}" aria-label="リンクをコピー">リンクをコピー</button>` : ""}
        </div>

        <!-- 本（パンフレット） -->
        <div class="book" id="book-${idx}">${(() => {
          const th = getCoverTheme(idx);
          return `
          <div class="book-panel ${th.panelClass}">
            <div class="book-cover-wrap">
              ${th.panelBefore}
              <div class="book-cover ${th.coverClass}"
                   onclick="toggleBook(${idx})">
                <div class="book-flip-ghost book-flip-ghost--1"></div>
                <div class="book-flip-ghost book-flip-ghost--2"></div>
                <div class="book-cover-bg"
                     style="background-image:url('${imgSrc}');"
                     onerror="this.style.backgroundImage='url(${fallback})'"></div>
                <div class="book-cover-overlay" style="background:${th.overlay}"></div>
                ${th.coverInner}
                <div class="book-cover-inner-border"></div>
                <div class="book-cover-content">
                  <div class="book-cover-label" style="color:${th.accent}">${e.museum}</div>
                  <div class="book-cover-main-title">${e.title}</div>
                  <div class="book-cover-divider" style="background:${th.accent}"></div>
                  <div class="book-cover-museum">Special Exhibition</div>
                  <div class="book-cover-dates">${formatDate(e.start)} — ${formatDate(e.end)}</div>
                </div>
                <div class="book-cover-hint">
                  <span>open</span>
                  <span class="book-cover-hint-arrow">↓</span>
                </div>
              </div>
              ${th.panelAfter}
            </div>
            <div class="book-body">
              <div class="book-spread">
                <div class="book-left">
                  <img src="${imgSrc}"
                       onerror="if(this.src!=='${fallback}')this.src='${fallback}'" alt="${e.title}">
                </div>
                <div class="book-gutter"></div>
                <div class="book-right">
                  ${e.story
                    ? `<div class="pamphlet-story">${e.story.split("\n\n").map(p => `<p>${p}</p>`).join("")}</div>`
                    : `<div class="pamphlet-story"><p>${e.title}</p></div>`
                  }
                  <button class="book-close-btn" onclick="toggleBook(${idx})">× 閉じる</button>
                </div>
              </div>
            </div>
          </div>`;
        })()}
        </div>
      `;
      card.style.animationDelay = (idx * 0.07) + 's';
      list.appendChild(card);
    });
  }

  /* ===== 表紙テーマ（展覧会ごとに個性的な形・色） ===== */
  const COVER_THEMES = [
    { // 0: ワイエス — 肖像画の額縁
      accent: '#8fb0cc',
      overlay: 'linear-gradient(to bottom, rgba(20,28,44,0.15) 0%, rgba(20,28,44,0.55) 55%, rgba(10,16,28,0.90) 100%)',
      panelClass: 'bc-panel-portrait', coverClass: 'bc-portrait',
      panelBefore: '', coverInner: '', panelAfter: ''
    },
    { // 1: 加賀前田家 — 鳥居アーチ
      accent: '#c9a84c',
      overlay: 'linear-gradient(to bottom, rgba(14,8,2,0.10) 0%, rgba(14,8,2,0.50) 50%, rgba(8,4,0,0.92) 100%)',
      panelClass: '', coverClass: 'bc-arch',
      panelBefore: '', coverInner: '', panelAfter: ''
    },
    { // 2: 北斎 — 波形底辺
      accent: '#6888d0',
      overlay: 'linear-gradient(to bottom, rgba(6,12,32,0.08) 0%, rgba(6,12,32,0.48) 50%, rgba(4,8,22,0.92) 100%)',
      panelClass: '', coverClass: 'bc-wave',
      panelBefore: '', coverInner: '', panelAfter: ''
    },
    { // 3: モネ — 楕円パレット
      accent: '#7abca0',
      overlay: 'linear-gradient(to bottom, rgba(10,18,26,0.10) 0%, rgba(10,18,26,0.42) 45%, rgba(6,12,18,0.88) 100%)',
      panelClass: 'bc-panel-oval', coverClass: 'bc-oval',
      panelBefore: '', coverInner: '', panelAfter: ''
    },
    { // 4: 観山 — 掛け軸（上下に軸棒）
      accent: '#c0b8b0',
      overlay: 'linear-gradient(to bottom, rgba(4,4,4,0.20) 0%, rgba(4,4,4,0.55) 55%, rgba(4,4,4,0.93) 100%)',
      panelClass: 'bc-kakemono-wrap', coverClass: 'bc-kakemono',
      panelBefore: '<div class="bc-kakemono-roller"></div>',
      coverInner: '',
      panelAfter:  '<div class="bc-kakemono-roller"></div>'
    },
    { // 5: テートYBA — 破れた紙
      accent: '#e03030',
      overlay: 'linear-gradient(to bottom, rgba(4,4,4,0.05) 0%, rgba(4,4,4,0.50) 50%, rgba(4,4,4,0.94) 100%)',
      panelClass: '', coverClass: 'bc-torn',
      panelBefore: '', coverInner: '', panelAfter: ''
    },
    { // 6: ロン・ミュエク — LPレコード
      accent: '#c8a880',
      overlay: 'radial-gradient(circle at center, rgba(14,11,8,0.55) 0%, rgba(8,6,4,0.88) 100%)',
      panelClass: 'bc-vinyl-wrap', coverClass: 'bc-vinyl',
      panelBefore: '',
      coverInner: `<div class="bc-vinyl-groove"></div>
        <div class="bc-vinyl-label"><div class="bc-vinyl-label-text">RON<br>MUECK</div></div>
        <div class="bc-vinyl-hole"></div>`,
      panelAfter: ''
    },
    { // 7: 新版画 — 平行四辺形
      accent: '#c88040',
      overlay: 'linear-gradient(to bottom, rgba(22,10,4,0.12) 0%, rgba(22,10,4,0.50) 50%, rgba(14,6,2,0.92) 100%)',
      panelClass: '', coverClass: 'bc-slant',
      panelBefore: '', coverInner: '', panelAfter: ''
    },
    { // 8: 暁斎 — ブラウン管テレビ
      accent: '#c02820',
      overlay: 'linear-gradient(to bottom, rgba(8,3,3,0.12) 0%, rgba(8,3,3,0.50) 50%, rgba(5,2,2,0.93) 100%)',
      panelClass: 'bc-crt-wrap', coverClass: 'bc-crt',
      panelBefore: '',
      coverInner: `<div class="bc-crt-antenna bc-crt-antenna--l"></div>
        <div class="bc-crt-antenna bc-crt-antenna--r"></div>
        <div class="bc-crt-knobs">
          <div class="bc-crt-knob"></div><div class="bc-crt-knob"></div><div class="bc-crt-knob"></div>
        </div>`,
      panelAfter: ''
    },
    { // 9: エリック・カール — 六角形
      accent: '#50b868',
      overlay: 'linear-gradient(to bottom, rgba(4,14,18,0.10) 0%, rgba(4,14,18,0.45) 50%, rgba(2,8,12,0.90) 100%)',
      panelClass: 'bc-hex-wrap', coverClass: 'bc-hex',
      panelBefore: '', coverInner: '', panelAfter: ''
    },
  ];

  function getCoverTheme(idx) { return COVER_THEMES[idx % COVER_THEMES.length]; }

  function toggleBook(idx) {
    const book   = document.getElementById(`book-${idx}`);
    const cover  = book.querySelector('.book-cover');
    const isOpen = book.classList.contains('open');

    if (!isOpen) {
      cover.classList.add('flipping');
      cover.addEventListener('animationend', () => {
        cover.classList.remove('flipping');
        book.classList.add('open');
      }, { once: true });
    } else {
      book.classList.remove('open');
      requestAnimationFrame(() => {
        cover.classList.add('flipping-back');
        cover.addEventListener('animationend', () => {
          cover.classList.remove('flipping-back');
        }, { once: true });
      });
    }
  }

  document.getElementById("sort").addEventListener("change", render);
  document.getElementById("search").addEventListener("input", render);

  // イベント委譲（お気に入り・訪問済み・URLコピー）
  document.getElementById("list").addEventListener("click", function(e) {
    // お気に入りボタン
    const favBtn = e.target.closest(".fav-btn");
    if (favBtn) {
      e.preventDefault();
      e.stopPropagation();
      const favId = favBtn.dataset.favId;
      const isNowFav = favBtn.classList.toggle("active");
      favBtn.textContent = isNowFav ? "♥" : "♡";
      setFav(favId, isNowFav);
      return;
    }

    // 訪問済みボタン
    const visitedBtn = e.target.closest(".visited-btn");
    if (visitedBtn) {
      e.preventDefault();
      e.stopPropagation();
      const visitedId = visitedBtn.dataset.visitedId;
      const isNowVisited = visitedBtn.classList.toggle("active");
      setVisited(visitedId, isNowVisited);
      const card = visitedBtn.closest(".card");
      if (card) card.classList.toggle("visited", isNowVisited);
      return;
    }

    // URLコピーボタン
    const copyBtn = e.target.closest(".copy-link-btn");
    if (copyBtn) {
      e.preventDefault();
      e.stopPropagation();
      const url = copyBtn.dataset.copyUrl;
      navigator.clipboard.writeText(url).then(() => {
        copyBtn.classList.add("copied");
        const orig = copyBtn.textContent;
        copyBtn.textContent = "✓ コピーしました";
        setTimeout(() => {
          copyBtn.textContent = orig;
          copyBtn.classList.remove("copied");
        }, 1500);
      }).catch(() => {
        // clipboard API非対応環境のフォールバック
        const ta = document.createElement("textarea");
        ta.value = url;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        copyBtn.classList.add("copied");
        const orig = copyBtn.textContent;
        copyBtn.textContent = "✓ コピーしました";
        setTimeout(() => {
          copyBtn.textContent = orig;
          copyBtn.classList.remove("copied");
        }, 1500);
      });
      return;
    }
  });

  fetchExhibitions();
  </script>

</body>
</html>
