<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUnCh — Tokyo Exhibitions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Noto+Serif+JP:wght@300;400&display=swap" rel="stylesheet">

  <style>
    :root {
      --cream: #f0ebe0;
      --gold:  #c9a84c;
      --dark:  #0a0a0a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--dark);
      color: var(--cream);
      font-family: 'Cormorant Garamond', 'Noto Serif JP', serif;
      min-height: 100vh;
    }

    /* ヘッダー */
    .header {
      padding: 32px 48px 28px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 1px solid rgba(240,235,224,0.08);
    }

    .logo {
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: rgba(240,235,224,0.6);
    }

    .logo-link { text-decoration: none; }

    .page-title {
      font-size: 26px;
      font-weight: 300;
      font-style: italic;
      letter-spacing: 0.04em;
      color: var(--cream);
      margin-top: 6px;
    }

    /* タブナビ */
    .nav-tabs { display: flex; }

    .nav-tab {
      font-family: 'Cormorant Garamond', serif;
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: rgba(240,235,224,0.38);
      text-decoration: none;
      padding: 7px 18px;
      border: 1px solid rgba(240,235,224,0.14);
      transition: color 0.3s, background 0.3s, border-color 0.3s;
    }

    .nav-tab + .nav-tab { border-left: none; }

    .nav-tab.active {
      color: var(--cream);
      background: rgba(240,235,224,0.07);
      border-color: rgba(240,235,224,0.28);
    }

    .nav-tab:hover:not(.active) {
      color: var(--gold);
      border-color: rgba(201,168,76,0.35);
    }

    /* コントロール */
    .controls {
      padding: 18px 48px;
      display: flex;
      align-items: center;
      gap: 20px;
      border-bottom: 1px solid rgba(240,235,224,0.06);
    }

    .controls-label {
      font-size: 9px;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: rgba(240,235,224,0.45);
    }

    .sort-select {
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(240,235,224,0.18);
      color: var(--cream);
      font-family: 'Cormorant Garamond', serif;
      font-size: 14px;
      letter-spacing: 0.05em;
      padding: 2px 0;
      cursor: pointer;
      outline: none;
    }

    .sort-select option { background: #111; }

    .count {
      margin-left: auto;
      font-size: 10px;
      letter-spacing: 0.25em;
      color: rgba(240,235,224,0.2);
    }

    /* ステータス（エラー時のみ表示） */
    #status {
      display: none;
      padding: 16px 48px;
      font-size: 12px;
      letter-spacing: 0.05em;
      color: rgba(224,90,90,0.7);
    }

    /* チケットリスト */
    .grid {
      display: flex;
      flex-direction: column;
      gap: 24px;
      padding: 20px 0 40px;
    }

    /* カード外枠 */
    .card {
      background: var(--dark);
      border: 1px solid rgba(240,235,224,0.07);
    }

    /* チケット本体 */
    .ticket-link {
      display: flex;
      text-decoration: none;
      color: inherit;
      min-height: 130px;
      background: #f0ebe0;
      position: relative;
      transition: filter 0.3s;
      /* 紙テクスチャ */
      background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.72' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"),
        linear-gradient(160deg, #f5f0e8 0%, #ede8dc 60%, #f0ebe0 100%);
    }
    .ticket-link:hover { filter: brightness(1.03) contrast(1.01); }

    /* 左：画像 */
    .ticket-img-wrap {
      width: 90px;
      flex-shrink: 0;
      overflow: hidden;
    }

    .ticket-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: sepia(0.15) contrast(1.05);
      transition: filter 0.4s;
    }
    .ticket-link:hover .ticket-img { filter: sepia(0) contrast(1.1); }

    /* 中：本文 */
    .ticket-body {
      flex: 1;
      padding: 14px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #111;
    }

    .ticket-admit {
      font-size: 8px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #999;
    }

    .ticket-title {
      font-family: 'Noto Serif JP', serif;
      font-size: 14px;
      font-weight: 400;
      color: #111;
      line-height: 1.55;
      letter-spacing: 0.03em;
      margin-top: 7px;
    }

    .ticket-museum {
      font-family: 'Cormorant Garamond', serif;
      font-size: 12px;
      letter-spacing: 0.1em;
      color: #555;
      margin-top: 5px;
    }

    .ticket-copy {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 12px;
      color: #888;
      margin-top: 5px;
    }

    .ticket-dates {
      font-family: 'Cormorant Garamond', serif;
      font-size: 12px;
      letter-spacing: 0.1em;
      color: #333;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px dashed rgba(0,0,0,0.15);
    }

    /* ミシン目 */
    .ticket-perf {
      width: 14px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      background: #f0ebe0;
    }

    .ticket-perf::after {
      content: '';
      position: absolute;
      top: 8px;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      border-left: 1px dashed rgba(0,0,0,0.18);
    }

    .perf-notch {
      width: 14px;
      height: 7px;
      background: var(--dark);
      flex-shrink: 0;
      z-index: 1;
    }

    .perf-notch.top    { border-radius: 0 0 7px 7px; }
    .perf-notch.bottom { border-radius: 7px 7px 0 0; margin-top: auto; }

    /* 右：スタブ */
    .ticket-stub {
      width: 66px;
      flex-shrink: 0;
      background: #e5e0d5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 0;
    }

    .stub-label {
      writing-mode: vertical-rl;
      font-family: 'Cormorant Garamond', serif;
      font-size: 8px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #bbb;
    }

    .stub-museum {
      writing-mode: vertical-rl;
      font-family: 'Noto Serif JP', serif;
      font-size: 9px;
      letter-spacing: 0.08em;
      color: #777;
      max-height: 80px;
      overflow: hidden;
    }

    .stub-number {
      font-family: 'Cormorant Garamond', serif;
      font-size: 8px;
      color: #ccc;
      letter-spacing: 0.08em;
    }

    /* 終了間近スタンプ */
    .ticket-ending {
      position: absolute;
      bottom: 44px;
      right: 80px;
      font-size: 7px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(200,55,55,0.8);
      border: 1px solid rgba(200,55,55,0.35);
      padding: 3px 7px;
      transform: rotate(-4deg);
      pointer-events: none;
    }

    /* 距離・フッター */
    .card-distance {
      font-family: 'Cormorant Garamond', serif;
      font-size: 11px;
      color: rgba(240,235,224,0.38);
      padding: 6px 18px 4px;
      letter-spacing: 0.05em;
    }

    .card-footer {
      padding: 6px 18px 10px;
      display: flex;
      gap: 16px;
    }

    .card-footer a {
      font-family: 'Cormorant Garamond', serif;
      font-size: 11px;
      color: rgba(240,235,224,0.38);
      text-decoration: none;
      letter-spacing: 0.08em;
      transition: color 0.3s;
    }

    .card-footer a:hover { color: var(--gold); }

    /* ===== 本（パンフレット） ===== */
    .book {
      border-top: 1px solid rgba(201,168,76,0.18);
    }

    /* ページめくりアニメーション */
    @keyframes pageFlip {
      0%   { transform: perspective(520px) rotateX(0deg) translateY(0); opacity: 1; }
      30%  { transform: perspective(520px) rotateX(-25deg) translateY(-8px); opacity: 0.95; }
      70%  { transform: perspective(520px) rotateX(-80deg) translateY(-4px); opacity: 0.4; }
      100% { transform: perspective(520px) rotateX(-95deg) translateY(0); opacity: 0; }
    }
    @keyframes pageSheen {
      0%   { left: -120%; opacity: 0; }
      20%  { opacity: 1; }
      100% { left: 120%;  opacity: 0; }
    }
    @keyframes pageFlipBack {
      0%   { transform: perspective(520px) rotateX(-95deg); opacity: 0; }
      40%  { transform: perspective(520px) rotateX(-20deg); opacity: 0.7; }
      100% { transform: perspective(520px) rotateX(0deg);   opacity: 1; }
    }

    /* 表紙ラッパー（高さ管理） */
    .book-cover-wrap {
      overflow: visible;
      max-height: 400px;
      transition: max-height 0.05s 0.38s ease;
    }
    .book.open .book-cover-wrap {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.05s 0.38s ease;
    }

    /* 表紙本体 */
    .book-cover {
      position: relative;
      height: 200px;
      overflow: hidden;
      cursor: pointer;
      user-select: none;
      transform-origin: top center;
      transition: filter 0.25s;
    }
    .book-cover:hover { filter: brightness(1.10) contrast(1.02); }

    /* めくり中のシェーン */
    .book-cover::after {
      content: '';
      position: absolute;
      top: 0; bottom: 0;
      left: -120%; width: 60%;
      background: linear-gradient(to right,
        transparent, rgba(255,255,255,0.13) 50%, transparent);
      pointer-events: none;
      opacity: 0;
      z-index: 20;
    }
    .book-cover.flipping::after {
      animation: pageSheen 0.42s ease-in forwards;
    }
    .book-cover.flipping {
      animation: pageFlip 0.42s cubic-bezier(0.4,0,0.6,1) forwards;
    }
    .book-cover.flipping-back {
      animation: pageFlipBack 0.38s cubic-bezier(0.2,0,0.4,1) forwards;
    }

    /* 背景画像 */
    .book-cover-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center top;
      filter: sepia(0.18) contrast(1.06) brightness(0.88);
      transition: transform 0.4s ease;
    }
    .book-cover:hover .book-cover-bg { transform: scale(1.03); }

    /* オーバーレイ */
    .book-cover-overlay {
      position: absolute;
      inset: 0;
    }

    /* 内側装飾ボーダー */
    .book-cover-inner-border {
      position: absolute;
      inset: 10px;
      pointer-events: none;
      z-index: 2;
    }

    /* テキストコンテンツ */
    .book-cover-content {
      position: relative;
      z-index: 3;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 20px 22px 16px;
    }
    .book-cover-label {
      font-family: 'Cormorant Garamond', serif;
      font-size: 8px;
      letter-spacing: 0.36em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .book-cover-main-title {
      font-family: 'Noto Serif JP', serif;
      font-size: 15px;
      font-weight: 400;
      line-height: 1.65;
      letter-spacing: 0.04em;
      color: rgba(240,235,224,0.92);
      margin-bottom: 8px;
    }
    .book-cover-divider {
      height: 1px;
      width: 36px;
      margin-bottom: 8px;
    }
    .book-cover-museum {
      font-family: 'Cormorant Garamond', serif;
      font-size: 10px;
      letter-spacing: 0.14em;
      color: rgba(240,235,224,0.55);
      margin-bottom: 2px;
    }
    .book-cover-dates {
      font-family: 'Cormorant Garamond', serif;
      font-size: 10px;
      letter-spacing: 0.1em;
      color: rgba(240,235,224,0.42);
    }
    .book-cover-hint {
      position: absolute;
      z-index: 3;
      bottom: 12px; right: 16px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 9px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(240,235,224,0.32);
      display: flex; align-items: center; gap: 5px;
      transition: opacity 0.2s;
    }
    .book-cover:hover .book-cover-hint { opacity: 0.65; }

    /* ========== 形状テーマ ========== */

    /* 1: ポートレートフレーム（ワイエス） */
    .bc-portrait {
      width: 52%;
      height: 220px;
      margin: 10px auto;
      box-shadow:
        0 0 0 6px #1c1a14,
        0 0 0 8px rgba(143,176,204,0.25),
        0 0 0 14px #1c1a14,
        0 8px 32px rgba(0,0,0,0.6);
    }
    .bc-portrait .book-cover-inner-border {
      inset: 8px;
      border: 1px solid rgba(143,176,204,0.30);
    }

    /* 2: 鳥居アーチ（加賀前田家） */
    .bc-arch {
      border-radius: 50% 50% 0 0 / 32% 32% 0 0;
      box-shadow: 0 8px 30px rgba(0,0,0,0.55);
    }
    .bc-arch .book-cover-inner-border {
      inset: 8px;
      border: 1px solid rgba(201,168,76,0.32);
      border-radius: 46% 46% 0 0 / 28% 28% 0 0;
    }

    /* 3: 波形底辺（北斎） */
    .bc-wave {
      clip-path: polygon(0 0,100% 0,100% 85%,97.5% 90%,95% 85%,92.5% 91%,90% 85%,87.5% 91%,85% 85%,82.5% 91%,80% 85%,77.5% 91%,75% 85%,72.5% 91%,70% 85%,67.5% 91%,65% 85%,62.5% 91%,60% 85%,57.5% 91%,55% 85%,52.5% 91%,50% 85%,47.5% 91%,45% 85%,42.5% 91%,40% 85%,37.5% 91%,35% 85%,32.5% 91%,30% 85%,27.5% 91%,25% 85%,22.5% 91%,20% 85%,17.5% 91%,15% 85%,12.5% 91%,10% 85%,7.5% 91%,5% 85%,2.5% 91%,0 85%);
    }
    .bc-wave .book-cover-inner-border {
      inset: 8px;
      border: 1px solid rgba(104,136,208,0.26);
    }

    /* 4: 楕円（モネ） */
    .bc-oval {
      width: 82%;
      height: 210px;
      border-radius: 50%;
      margin: 8px auto;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .bc-oval .book-cover-inner-border {
      border: 1px solid rgba(122,188,160,0.28);
      border-radius: 50%;
    }

    /* 5: 掛け軸（観山） */
    .bc-kakemono-wrap {
      padding: 0 24%;
    }
    .bc-kakemono {
      height: 240px;
      overflow: visible;
    }
    .bc-kakemono-roller {
      position: relative;
      z-index: 5;
      height: 14px;
      background: linear-gradient(to bottom, #3a2a18, #5a4030 40%, #3a2a18);
      border-radius: 7px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.1);
    }
    .bc-kakemono .book-cover-inner-border {
      border-top: 2px solid rgba(192,184,176,0.38);
      border-bottom: 2px solid rgba(192,184,176,0.38);
      border-left: none; border-right: none;
      inset: 0 10px;
    }

    /* 6: 破れた紙（テートYBA） */
    .bc-torn {
      clip-path: polygon(0 0,100% 0,100% 68%,97% 72%,100% 76%,96% 80%,100% 84%,97% 88%,100% 92%,95% 96%,100% 100%,88% 95%,82% 100%,76% 93%,70% 100%,64% 94%,58% 100%,52% 93%,46% 100%,40% 94%,34% 100%,28% 93%,22% 100%,16% 94%,10% 100%,4% 94%,0 100%);
    }
    .bc-torn .book-cover-inner-border {
      inset: 8px;
      border: 1px solid rgba(224,48,48,0.28);
    }

    /* 7: レコード（ロン・ミュエク） */
    .bc-vinyl-wrap {
      padding: 8px 0 8px;
      display: flex;
      justify-content: center;
    }
    .bc-vinyl {
      width: min(200px,58vw);
      height: min(200px,58vw);
      border-radius: 50%;
      flex-shrink: 0;
      overflow: hidden;
    }
    .bc-vinyl-groove {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: repeating-radial-gradient(
        circle at center,
        transparent 0px, transparent 9px,
        rgba(0,0,0,0.18) 9px, rgba(0,0,0,0.18) 10px
      );
      z-index: 1;
    }
    .bc-vinyl-label {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      width: 42%; height: 42%;
      border-radius: 50%;
      background: radial-gradient(circle, #2a1c08 60%, #1a1005);
      border: 1px solid rgba(201,168,76,0.35);
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .bc-vinyl-label-text {
      font-family: 'Noto Serif JP', serif;
      font-size: 7px;
      font-weight: 300;
      color: rgba(240,235,224,0.7);
      text-align: center;
      letter-spacing: 0.04em;
      padding: 4px;
      line-height: 1.5;
    }
    .bc-vinyl-hole {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--dark);
      z-index: 5;
      box-shadow: 0 0 0 2px rgba(240,235,224,0.1);
    }
    .bc-vinyl .book-cover-content { display: none; }
    .bc-vinyl .book-cover-hint {
      bottom: 14%; right: 50%;
      transform: translateX(50%);
      z-index: 6;
    }

    /* 8: 平行四辺形（新版画） */
    .bc-slant {
      clip-path: polygon(6% 0,100% 0,94% 100%,0 100%);
    }
    .bc-slant .book-cover-inner-border {
      inset: 8px;
      border: 1px solid rgba(200,128,64,0.26);
    }

    /* 9: ブラウン管テレビ（暁斎） */
    .bc-crt-wrap {
      padding: 0 4%;
    }
    .bc-crt {
      border-radius: 16% 16% 10% 10% / 10% 10% 7% 7%;
      box-shadow:
        0 0 0 10px #1a0808,
        0 0 0 14px #0f0505,
        0 10px 36px rgba(0,0,0,0.7);
      overflow: visible;
    }
    .bc-crt .book-cover-bg {
      border-radius: 14% 14% 8% 8% / 8% 8% 5% 5%;
    }
    .bc-crt .book-cover-overlay {
      border-radius: 14% 14% 8% 8% / 8% 8% 5% 5%;
    }
    .bc-crt .book-cover-inner-border {
      inset: 12px;
      border: 2px solid rgba(192,40,32,0.32);
      border-radius: 12% 12% 6% 6% / 8% 8% 4% 4%;
    }
    .bc-crt-antenna {
      position: absolute;
      bottom: 100%; margin-bottom: 4px;
      width: 3px;
      height: 40px;
      background: linear-gradient(to top, #1a0808, #2a1010);
      border-radius: 2px;
      z-index: 10;
      transform-origin: bottom center;
    }
    .bc-crt-antenna--l { left: 28%; transform: rotate(-22deg); }
    .bc-crt-antenna--r { right: 28%; transform: rotate(22deg); }
    .bc-crt-knobs {
      position: absolute;
      bottom: -18px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 10;
    }
    .bc-crt-knob {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #3a1010, #1a0505);
      border: 1px solid #2a0808;
      box-shadow: 0 1px 4px rgba(0,0,0,0.8);
    }

    /* 10: 六角形ポップ（エリック・カール） */
    .bc-hex-wrap {
      padding: 6px 8%;
    }
    .bc-hex {
      clip-path: polygon(25% 0%,75% 0%,100% 50%,75% 100%,25% 100%,0% 50%);
      height: 220px;
    }
    .bc-hex .book-cover-inner-border {
      border: 2px solid rgba(80,184,104,0.30);
      clip-path: polygon(25% 0%,75% 0%,100% 50%,75% 100%,25% 100%,0% 50%);
      inset: 0;
    }

    /* 開閉アニメーション */
    .book-body {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.5s cubic-bezier(0.16,1,0.3,1);
    }

    .book.open .book-body { grid-template-rows: 1fr; }

    /* 開いたページ（両開き） */
    .book-spread {
      overflow: hidden;
      min-height: 0;
      display: flex;
      box-shadow: inset 0 6px 16px rgba(0,0,0,0.20);
    }

    /* 左ページ：画像 */
    .book-left {
      width: 42%;
      flex-shrink: 0;
      overflow: hidden;
      position: relative;
      background: #1a1410;
    }

    .book-left img {
      width: 100%;
      height: 100%;
      min-height: 250px;
      object-fit: cover;
      display: block;
      filter: sepia(0.12) contrast(1.04);
    }

    /* ページ番号（左ページ下） */
    .book-left-folio {
      position: absolute;
      bottom: 10px;
      left: 0; right: 0;
      text-align: center;
      font-family: 'Cormorant Garamond', serif;
      font-size: 9px;
      letter-spacing: 0.2em;
      color: rgba(240,235,224,0.4);
      pointer-events: none;
    }

    /* 背の折り目（ガター） */
    .book-gutter {
      width: 20px;
      flex-shrink: 0;
      background: linear-gradient(to right,
        rgba(0,0,0,0.24),
        rgba(0,0,0,0.08) 25%,
        rgba(255,255,255,0.30) 50%,
        rgba(0,0,0,0.05) 75%,
        rgba(0,0,0,0.01)
      );
      box-shadow:
        3px 0 10px rgba(0,0,0,0.10),
        -2px 0 5px rgba(255,255,255,0.22);
    }

    /* 右ページ：ストーリー */
    .book-right {
      flex: 1;
      padding: 20px 22px 20px 18px;
      display: flex;
      flex-direction: column;
      color: #111;
      background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.72' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"),
        linear-gradient(160deg, #f5f0e8 0%, #ede8dc 100%);
    }

    /* ページ上部の装飾罫 */
    .book-right-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(0,0,0,0.1);
    }

    .book-right-header-rule {
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, rgba(0,0,0,0.12), transparent);
    }

    .book-right-header-label {
      font-family: 'Cormorant Garamond', serif;
      font-size: 8px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(201,168,76,0.7);
    }

    /* ストーリー本文 */
    .pamphlet-story {
      font-family: 'Noto Serif JP', serif;
      font-size: 11.5px;
      font-weight: 300;
      color: #2a2a2a;
      line-height: 2.1;
      letter-spacing: 0.04em;
      flex: 1;
    }

    .pamphlet-story p { margin: 0; }
    .pamphlet-story p + p { margin-top: 1.1em; }

    /* ページ番号（右ページ下） */
    .book-right-folio {
      font-family: 'Cormorant Garamond', serif;
      font-size: 9px;
      letter-spacing: 0.2em;
      color: rgba(0,0,0,0.22);
      text-align: right;
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px solid rgba(0,0,0,0.08);
    }

    .pamphlet-link {
      display: inline-block;
      margin-top: 12px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #333;
      text-decoration: none;
      border-bottom: 1px solid rgba(0,0,0,0.2);
      padding-bottom: 2px;
      transition: color 0.3s, border-color 0.3s;
      align-self: flex-start;
    }

    .pamphlet-link:hover {
      color: #c9a84c;
      border-color: rgba(201,168,76,0.5);
    }

    /* 空状態 */
    .empty {
      padding: 80px;
      text-align: center;
      font-size: 13px;
      letter-spacing: 0.15em;
      color: rgba(240,235,224,0.18);
    }

    /* フッター */
    .footer {
      padding: 40px 48px;
      border-top: 1px solid rgba(240,235,224,0.06);
      margin-top: 1px;
      text-align: center;
    }

    .footer-text {
      font-size: 10px;
      letter-spacing: 0.3em;
      color: rgba(240,235,224,0.12);
      text-transform: uppercase;
      font-style: italic;
    }

    @media (max-width: 480px) {
      .header   { padding: 24px 20px 20px; }
      .controls { padding: 14px 20px; }
      .page-title { font-size: 20px; }
    }
  </style>
</head>
<body>

  <header class="header">
    <div>
      <a href="index.html" class="logo-link">
        <div class="logo">MUnCh — Tokyo Exhibitions</div>
      </a>
      <div class="page-title">開催中の特別展</div>
    </div>
    <nav class="nav-tabs">
      <a href="list.html" class="nav-tab active">一覧</a>
      <a href="map.html"  class="nav-tab">地図</a>
    </nav>
  </header>

  <div class="controls">
    <span class="controls-label">Sort</span>
    <select id="sort" class="sort-select">
      <option value="end">終了が近い順</option>
      <option value="title">タイトル順</option>
      <option value="near">近い順</option>
      <option value="ueno">上野エリア</option>
    </select>
    <span class="count" id="count"></span>
  </div>

  <div id="status"></div>
  <div class="grid" id="list"></div>

  <footer class="footer">
    <div class="footer-text">東京の展覧会を、映画のように。</div>
  </footer>

  <script>
  const museumCoords = {
    "東京都美術館":               { lat: 35.7172, lng: 139.7765 },
    "東京国立近代美術館":          { lat: 35.6909, lng: 139.7544 },
    "東京藝術大学大学美術館":      { lat: 35.7188, lng: 139.7753 },
    "国立西洋美術館":              { lat: 35.7155, lng: 139.7757 },
    "上野の森美術館":              { lat: 35.7130, lng: 139.7736 },
    "東京都現代美術館":            { lat: 35.6817, lng: 139.8016 },
    "森美術館":                   { lat: 35.6604, lng: 139.7292 },
    "国立新美術館":                { lat: 35.6655, lng: 139.7279 },
    "サントリー美術館":            { lat: 35.6643, lng: 139.7310 },
    "東京国立博物館":              { lat: 35.7188, lng: 139.7764 },
    "江戸東京博物館":              { lat: 35.6966, lng: 139.7973 },
    "世田谷美術館":                { lat: 35.6321, lng: 139.5898 },
    "東京都写真美術館":            { lat: 35.6412, lng: 139.7133 },
    "アーティゾン美術館":          { lat: 35.6805, lng: 139.7680 },
    "パナソニック汐留美術館":      { lat: 35.6641, lng: 139.7590 },
    "三菱一号館美術館":            { lat: 35.6820, lng: 139.7638 },
    "SOMPO美術館":                { lat: 35.6896, lng: 139.6982 },
    "郷さくら美術館":              { lat: 35.6384, lng: 139.7101 },
    "根津美術館":                  { lat: 35.6599, lng: 139.7161 },
    "山種美術館":                  { lat: 35.6631, lng: 139.7203 },
    "畠山記念館":                  { lat: 35.6488, lng: 139.7344 },
    "五島美術館":                  { lat: 35.6185, lng: 139.6613 },
  };

  const defaultCoord = { lat: 35.6895, lng: 139.6917 };
  let exhibitions = [];
  let userLat = null, userLng = null;

  navigator.geolocation.getCurrentPosition(pos => {
    userLat = pos.coords.latitude;
    userLng = pos.coords.longitude;
    render();
  });

  function getDistance(lat1, lng1, lat2, lng2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLng = (lng2 - lng1) * Math.PI / 180;
    const a = Math.sin(dLat/2)**2 +
      Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLng/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  function toWalkTime(km) { return Math.round(km * 15); }

  function formatDate(s) {
    if (!s) return "—";
    const d = new Date(s);
    if (isNaN(d)) return s;
    return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")}`;
  }

  function daysUntil(dateStr) {
    if (!dateStr) return Infinity;
    return Math.ceil((new Date(dateStr) - new Date()) / 86400000);
  }

  function getCoord(name) { return museumCoords[name] || defaultCoord; }

  function getArea(name) {
    const ueno = ["東京都美術館","国立西洋美術館","東京国立博物館","上野の森美術館","東京藝術大学大学美術館","東京国立近代美術館"];
    return ueno.includes(name) ? "上野" : "その他";
  }

  async function fetchExhibitions() {
    try {
      const res = await fetch("exhibitions.json");
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const raw = await res.json();
      exhibitions = raw.map(e => ({ ...e, ...getCoord(e.museum), area: getArea(e.museum) }));
      render();
    } catch (err) {
      const el = document.getElementById("status");
      el.style.display = "block";
      el.textContent = `データ読み込み失敗: exhibitions.json が見つかりません`;
    }
  }

  function render() {
    const sortVal = document.getElementById("sort").value;
    const list    = document.getElementById("list");
    const now     = new Date();

    let data = exhibitions.filter(e => !e.end || new Date(e.end) >= now);

    if (sortVal === "end") {
      data.sort((a,b) => new Date(a.end||"9999") - new Date(b.end||"9999"));
    } else if (sortVal === "title") {
      data.sort((a,b) => a.title.localeCompare(b.title, "ja"));
    } else if (sortVal === "ueno") {
      data = data.filter(e => e.area === "上野");
    } else if (sortVal === "near" && userLat) {
      data.sort((a,b) => getDistance(userLat,userLng,a.lat,a.lng) - getDistance(userLat,userLng,b.lat,b.lng));
    }

    document.getElementById("count").textContent = `${data.length} exhibitions`;
    list.innerHTML = "";

    if (data.length === 0) {
      list.innerHTML = `<div class="empty">該当する展覧会が見つかりませんでした</div>`;
      return;
    }

    data.forEach((e, idx) => {
      const days     = daysUntil(e.end);
      const imgSrc   = (e.image_url && e.image_url !== "")
        ? e.image_url
        : `https://picsum.photos/seed/${encodeURIComponent(e.title)}/400/600`;
      const fallback = `https://picsum.photos/seed/${encodeURIComponent(e.museum)}/400/600`;
      const num      = String(idx + 1).padStart(4, "0");

      let distanceHtml = "";
      if (userLat && userLng) {
        const d = getDistance(userLat, userLng, e.lat, e.lng);
        distanceHtml = `<div class="card-distance">${d.toFixed(1)} km — 徒歩 ${toWalkTime(d)} 分</div>`;
      }

      const card = document.createElement("div");
      card.className = "card";
      card.style.position = "relative";
      card.innerHTML = `
        <a href="${e.url || '#'}" class="ticket-link" ${e.url ? 'target="_blank"' : ''}>
          <div class="ticket-img-wrap">
            <img class="ticket-img" src="${imgSrc}"
                 onerror="if(this.src!=='${fallback}')this.src='${fallback}'" alt="${e.title}">
          </div>
          <div class="ticket-body">
            <div>
              <div class="ticket-admit">Admit One — Special Exhibition</div>
              <div class="ticket-title">${e.title}</div>
              <div class="ticket-museum">${e.museum}</div>
              ${e.copy ? `<div class="ticket-copy">"${e.copy}"</div>` : ""}
            </div>
            <div class="ticket-dates">${formatDate(e.start)} — ${formatDate(e.end)}</div>
          </div>
          <div class="ticket-perf">
            <div class="perf-notch top"></div>
            <div class="perf-notch bottom"></div>
          </div>
          <div class="ticket-stub">
            <div class="stub-label">Viewing</div>
            <div class="stub-museum">${e.museum}</div>
            <div class="stub-number">No.${num}</div>
          </div>
        </a>
        ${days <= 7 ? `<div class="ticket-ending">Ending Soon</div>` : ""}
        ${distanceHtml}
        <div class="card-footer">
          <a href="https://www.google.com/maps/search/?api=1&query=${e.lat},${e.lng}" target="_blank">地図で見る</a>
          <a href="https://www.google.com/maps/dir/?api=1&destination=${e.lat},${e.lng}" target="_blank">ルート</a>
        </div>

        <!-- 本（パンフレット） -->
        <div class="book" id="book-${idx}">${(() => {
          const th = getCoverTheme(idx);
          return `
          <div class="book-cover-wrap ${th.wrapClass}">
            ${th.wrapBefore}
            <div class="book-cover ${th.coverClass}"
                 onclick="toggleBook(${idx})">
              <div class="book-cover-bg"
                   style="background-image:url('${imgSrc}');"
                   onerror="this.style.backgroundImage='url(${fallback})'"></div>
              <div class="book-cover-overlay" style="background:${th.overlay}"></div>
              ${th.coverInner}
              <div class="book-cover-inner-border"></div>
              <div class="book-cover-content">
                <div class="book-cover-label" style="color:${th.accent}">${e.museum}</div>
                <div class="book-cover-main-title">${e.title}</div>
                <div class="book-cover-divider" style="background:${th.accent}"></div>
                <div class="book-cover-museum">Special Exhibition</div>
                <div class="book-cover-dates">${formatDate(e.start)} — ${formatDate(e.end)}</div>
              </div>
              <div class="book-cover-hint">
                <span>open</span>
                <span class="book-cover-hint-arrow">↓</span>
              </div>
            </div>
            ${th.wrapAfter}
          </div>`;
        })()}
          <div class="book-body">
            <div class="book-spread">
              <div class="book-left">
                <img src="${imgSrc}"
                     onerror="if(this.src!=='${fallback}')this.src='${fallback}'" alt="${e.title}">
                <div class="book-left-folio">— ${String(idx * 2 + 1).padStart(2,"0")} —</div>
              </div>
              <div class="book-gutter"></div>
              <div class="book-right">
                <div class="book-right-header">
                  <div class="book-right-header-label">Story</div>
                  <div class="book-right-header-rule"></div>
                </div>
                ${e.story
                  ? `<div class="pamphlet-story">${e.story.split("\n\n").map(p => `<p>${p}</p>`).join("")}</div>`
                  : `<div class="pamphlet-story"><p>${e.title}</p></div>`
                }
                <div class="book-right-folio">
                  ${e.url ? `<a href="${e.url}" target="_blank" class="pamphlet-link">公式サイトを見る</a>` : ""}
                  <span style="margin-left:12px">— ${String(idx * 2 + 2).padStart(2,"0")} —</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
      list.appendChild(card);
    });
  }

  /* ===== 表紙テーマ（展覧会ごとに個性的な形・色） ===== */
  const COVER_THEMES = [
    { // 0: ワイエス — 肖像画の額縁
      accent: '#8fb0cc', overlay: 'rgba(20,28,44,0.76)',
      wrapClass: '', coverClass: 'bc-portrait',
      wrapBefore: '', coverInner: '', wrapAfter: ''
    },
    { // 1: 加賀前田家 — 鳥居アーチ
      accent: '#c9a84c', overlay: 'rgba(14,8,2,0.76)',
      wrapClass: '', coverClass: 'bc-arch',
      wrapBefore: '', coverInner: '', wrapAfter: ''
    },
    { // 2: 北斎 — 波形底辺
      accent: '#6888d0', overlay: 'rgba(6,12,32,0.78)',
      wrapClass: '', coverClass: 'bc-wave',
      wrapBefore: '', coverInner: '', wrapAfter: ''
    },
    { // 3: モネ — 楕円パレット
      accent: '#7abca0', overlay: 'rgba(10,18,26,0.72)',
      wrapClass: '', coverClass: 'bc-oval',
      wrapBefore: '', coverInner: '', wrapAfter: ''
    },
    { // 4: 観山 — 掛け軸（上下に軸棒）
      accent: '#c0b8b0', overlay: 'rgba(4,4,4,0.82)',
      wrapClass: 'bc-kakemono-wrap', coverClass: 'bc-kakemono',
      wrapBefore: '<div class="bc-kakemono-roller"></div>',
      coverInner: '',
      wrapAfter:  '<div class="bc-kakemono-roller"></div>'
    },
    { // 5: テートYBA — 破れた紙
      accent: '#e03030', overlay: 'rgba(4,4,4,0.86)',
      wrapClass: '', coverClass: 'bc-torn',
      wrapBefore: '', coverInner: '', wrapAfter: ''
    },
    { // 6: ロン・ミュエク — LPレコード（溝・ラベル・穴）
      accent: '#c8a880', overlay: 'rgba(14,11,8,0.82)',
      wrapClass: 'bc-vinyl-wrap', coverClass: 'bc-vinyl',
      wrapBefore: '',
      coverInner: `<div class="bc-vinyl-groove"></div>
        <div class="bc-vinyl-label"><div class="bc-vinyl-label-text">RON<br>MUECK</div></div>
        <div class="bc-vinyl-hole"></div>`,
      wrapAfter: ''
    },
    { // 7: 新版画 — 平行四辺形
      accent: '#c88040', overlay: 'rgba(22,10,4,0.76)',
      wrapClass: '', coverClass: 'bc-slant',
      wrapBefore: '', coverInner: '', wrapAfter: ''
    },
    { // 8: 暁斎 — ブラウン管テレビ（アンテナ・ダイヤル）
      accent: '#c02820', overlay: 'rgba(8,3,3,0.82)',
      wrapClass: 'bc-crt-wrap', coverClass: 'bc-crt',
      wrapBefore: '',
      coverInner: `<div class="bc-crt-antenna bc-crt-antenna--l"></div>
        <div class="bc-crt-antenna bc-crt-antenna--r"></div>
        <div class="bc-crt-knobs">
          <div class="bc-crt-knob"></div><div class="bc-crt-knob"></div><div class="bc-crt-knob"></div>
        </div>`,
      wrapAfter: ''
    },
    { // 9: エリック・カール — 六角形
      accent: '#50b868', overlay: 'rgba(4,14,18,0.74)',
      wrapClass: 'bc-hex-wrap', coverClass: 'bc-hex',
      wrapBefore: '', coverInner: '', wrapAfter: ''
    },
  ];

  function getCoverTheme(idx) { return COVER_THEMES[idx % COVER_THEMES.length]; }

  function toggleBook(idx) {
    const book   = document.getElementById(`book-${idx}`);
    const cover  = book.querySelector('.book-cover');
    const isOpen = book.classList.contains('open');

    if (!isOpen) {
      cover.classList.add('flipping');
      cover.addEventListener('animationend', () => {
        cover.classList.remove('flipping');
        book.classList.add('open');
      }, { once: true });
    } else {
      book.classList.remove('open');
      requestAnimationFrame(() => {
        cover.classList.add('flipping-back');
        cover.addEventListener('animationend', () => {
          cover.classList.remove('flipping-back');
        }, { once: true });
      });
    }
  }

  document.getElementById("sort").addEventListener("change", render);
  fetchExhibitions();
  </script>

</body>
</html>
