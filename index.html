<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUnCh</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: -apple-system, sans-serif;
  color: white;
}

/* 動画背景 */
.video-bg {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  overflow: hidden;
}

.video-bg iframe {
  position: absolute;
  top: 50%;
  left: 50%;

  width: 140vw;
  height: 140vh;

  transform: translate(-50%, -50%);
  pointer-events: none;
}

/* 右上カード */
.hero {
  position: absolute;
  top: 30px;
  right: 20px;
  width: 200px;
}

.hero img {
  width: 100%;
  border-radius: 12px;
}

.hero .title {
  font-size: 16px;
  margin-top: 8px;
}

.hero .date {
  font-size: 12px;
  color: #ccc;
}

/* 下にボタン */
.enter {
  position: absolute;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
}

.enter a {
  color: white;
  text-decoration: none;
  border: 1px solid white;
  padding: 10px 20px;
}

.hero {
  backdrop-filter: blur(6px);
  background: rgba(0,0,0,0.5);
  padding: 10px;
  border-radius: 12px;
}

</style>
</head>

<body>

<div class="video-bg">
  <iframe id="yt"></iframe>
</div>

<div class="hero" id="hero"></div>

<div class="enter">
  <a href="list.html">ENTER</a>
</div>

<script>
// 展覧会データ
const exhibitions = [
  {
    title: "アンドリュー・ワイエス展",
    start: "2026-04-28",
    end: "2026-07-05",
    image: "images/PICT0001.jpg"
  },
  {
    title: "下村観山展",
    start: "2026-03-17",
    end: "2026-05-10",
    image: "images/PICT0002.jpg"
  },
  {
    title: "NHK日曜美術館50年展",
    start: "2026-03-28",
    end: "2026-06-21",
    image: "images/PICT0003.jpg"
  }
];

// ランダム展覧会
const e = exhibitions[Math.floor(Math.random() * exhibitions.length)];

document.getElementById("hero").innerHTML = `
  <img src="${e.image}">
  <div class="title">${e.title}</div>
  <div class="date">${e.start} - ${e.end}</div>
`;

// 🎬 YouTubeランダム開始
const videoId = "pPZTTibvGQw"; // あなたのID
const start = Math.floor(Math.random() * 3600); // 0〜120秒

document.getElementById("yt").src =
  `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1&loop=1&playlist=${videoId}&start=${start}&controls=0&showinfo=0&modestbranding=1`;

</script>

</body>
</html>
