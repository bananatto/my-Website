<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUnCh — 展覧会詳細</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Noto+Serif+JP:wght@300;400&display=swap" rel="stylesheet">

  <style>
    :root {
      --cream: #f0ebe0;
      --gold:  #c9a84c;
      --dark:  #0a0a0a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--dark);
      color: var(--cream);
      font-family: 'Cormorant Garamond', 'Noto Serif JP', serif;
      min-height: 100vh;
    }

    /* ===== ヘッダーナビ ===== */
    .site-header {
      padding: 24px 52px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(240,235,224,0.08);
      position: relative;
      z-index: 10;
    }

    .logo {
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: rgba(240,235,224,0.6);
      text-decoration: none;
    }

    /* パンくずリスト */
    .breadcrumb {
      font-family: 'Cormorant Garamond', serif;
      font-size: 10px;
      letter-spacing: 0.22em;
      color: rgba(240,235,224,0.35);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .breadcrumb a {
      color: rgba(240,235,224,0.35);
      text-decoration: none;
      transition: color 0.25s;
    }

    .breadcrumb a:hover { color: var(--gold); }

    .breadcrumb-sep {
      color: rgba(240,235,224,0.18);
      font-size: 9px;
    }

    .breadcrumb-current {
      color: rgba(240,235,224,0.55);
      max-width: 240px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ===== ヒーロー画像 ===== */
    .hero {
      width: 100vw;
      height: 45vh;
      min-height: 240px;
      position: relative;
      overflow: hidden;
    }

    .hero-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 25%;
      display: block;
      filter: sepia(0.1) contrast(1.08) brightness(0.88);
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(10,10,10,0.10) 0%,
        rgba(10,10,10,0.22) 50%,
        rgba(10,10,10,0.72) 100%
      );
    }

    /* ゴールドアクセントライン（下端） */
    .hero::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(to right,
        transparent 0%,
        rgba(201,168,76,0.55) 30%,
        rgba(201,168,76,0.85) 50%,
        rgba(201,168,76,0.55) 70%,
        transparent 100%);
    }

    /* ===== メインコンテンツ ===== */
    .main {
      max-width: 820px;
      margin: 0 auto;
      padding: 0 32px 80px;
    }

    /* 展覧会タイトルブロック */
    .title-block {
      padding: 52px 0 40px;
      border-bottom: 1px solid rgba(240,235,224,0.08);
    }

    .exh-label {
      font-size: 9px;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--gold);
      opacity: 0.8;
      margin-bottom: 16px;
    }

    .exh-title {
      font-family: 'Noto Serif JP', serif;
      font-size: 28px;
      font-weight: 400;
      line-height: 1.55;
      letter-spacing: 0.04em;
      color: var(--cream);
      margin-bottom: 18px;
    }

    .exh-museum {
      font-family: 'Cormorant Garamond', serif;
      font-size: 15px;
      letter-spacing: 0.18em;
      color: rgba(240,235,224,0.58);
      margin-bottom: 10px;
    }

    .exh-dates {
      font-family: 'Cormorant Garamond', serif;
      font-size: 13px;
      letter-spacing: 0.1em;
      color: rgba(240,235,224,0.42);
      margin-bottom: 22px;
    }

    .exh-copy {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 17px;
      letter-spacing: 0.06em;
      color: rgba(240,235,224,0.72);
      border-left: 2px solid rgba(201,168,76,0.45);
      padding-left: 18px;
      margin-top: 8px;
    }

    /* ===== アクションボタン群 ===== */
    .action-bar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      padding: 28px 0 32px;
      border-bottom: 1px solid rgba(240,235,224,0.06);
    }

    /* お気に入り・訪問済みボタン */
    .btn-icon {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 9px 20px;
      border: 1px solid rgba(240,235,224,0.18);
      background: rgba(240,235,224,0.04);
      color: rgba(240,235,224,0.52);
      font-family: 'Cormorant Garamond', serif;
      font-size: 12px;
      letter-spacing: 0.2em;
      cursor: pointer;
      transition: all 0.25s;
      text-decoration: none;
    }

    .btn-icon:hover {
      color: var(--cream);
      border-color: rgba(240,235,224,0.45);
      background: rgba(240,235,224,0.08);
    }

    .btn-icon.fav-active {
      color: var(--gold);
      border-color: rgba(201,168,76,0.55);
      background: rgba(201,168,76,0.08);
    }

    .btn-icon.visited-active {
      color: rgba(160,220,160,0.85);
      border-color: rgba(130,200,130,0.45);
      background: rgba(20,40,20,0.18);
    }

    /* 外部リンク */
    .btn-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 20px;
      border: 1px solid rgba(201,168,76,0.32);
      background: transparent;
      color: rgba(201,168,76,0.78);
      font-family: 'Cormorant Garamond', serif;
      font-size: 12px;
      letter-spacing: 0.2em;
      text-decoration: none;
      transition: all 0.25s;
    }

    .btn-link:hover {
      color: var(--gold);
      border-color: rgba(201,168,76,0.7);
      background: rgba(201,168,76,0.06);
    }

    /* ===== ストーリーセクション ===== */
    .story-section {
      padding: 52px 0 48px;
      border-bottom: 1px solid rgba(240,235,224,0.06);
    }

    .section-label {
      font-size: 9px;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: rgba(240,235,224,0.28);
      margin-bottom: 32px;
    }

    .story-text {
      font-family: 'Noto Serif JP', serif;
      font-size: 14px;
      font-weight: 300;
      line-height: 2.2;
      letter-spacing: 0.05em;
      color: rgba(240,235,224,0.82);
    }

    .story-text p { margin: 0; }
    .story-text p + p { margin-top: 2em; }

    /* 先頭段落の大きな飾り文字 */
    .story-text p:first-child::first-letter {
      font-family: 'Cormorant Garamond', serif;
      font-size: 4em;
      font-style: italic;
      font-weight: 300;
      float: left;
      line-height: 0.75;
      padding-right: 10px;
      color: var(--gold);
      opacity: 0.7;
    }

    /* ===== 感想セクション ===== */
    .review-section {
      padding: 44px 0 48px;
    }

    .review-form-wrap {
      margin-top: 28px;
    }

    .review-name-input,
    .review-textarea {
      width: 100%;
      background: rgba(240,235,224,0.04);
      border: 1px solid rgba(240,235,224,0.10);
      color: var(--cream);
      font-family: 'Noto Serif JP', serif;
      font-size: 13px;
      padding: 10px 14px;
      outline: none;
      resize: vertical;
      transition: border-color 0.2s;
    }

    .review-name-input {
      margin-bottom: 10px;
      height: 40px;
      resize: none;
    }

    .review-name-input:focus,
    .review-textarea:focus {
      border-color: rgba(201,168,76,0.4);
    }

    .review-name-input::placeholder,
    .review-textarea::placeholder {
      color: rgba(240,235,224,0.25);
      font-style: italic;
    }

    .review-form-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }

    .review-char-count {
      font-family: 'Cormorant Garamond', serif;
      font-size: 10px;
      color: rgba(240,235,224,0.22);
    }

    .review-submit-btn {
      font-family: 'Cormorant Garamond', serif;
      font-size: 12px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      background: none;
      border: 1px solid rgba(201,168,76,0.42);
      color: rgba(201,168,76,0.82);
      padding: 8px 24px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .review-submit-btn:hover {
      background: rgba(201,168,76,0.08);
      border-color: rgba(201,168,76,0.7);
      color: var(--gold);
    }

    /* 投稿レビューカード */
    .review-list {
      margin-bottom: 8px;
    }

    .review-item {
      padding: 14px 18px;
      margin-bottom: 10px;
      border: 1px solid rgba(240,235,224,0.07);
      background: rgba(240,235,224,0.02);
    }

    .review-item-header {
      display: flex;
      justify-content: space-between;
      font-family: 'Cormorant Garamond', serif;
      font-size: 10px;
      color: rgba(240,235,224,0.35);
      margin-bottom: 8px;
      letter-spacing: 0.1em;
    }

    .review-item-text {
      font-family: 'Noto Serif JP', serif;
      font-size: 13px;
      line-height: 1.9;
      color: rgba(240,235,224,0.72);
    }

    .review-empty {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 13px;
      color: rgba(240,235,224,0.22);
      letter-spacing: 0.1em;
      padding: 10px 0;
    }

    /* ===== エラー・ローディング ===== */
    #error-block {
      display: none;
      max-width: 820px;
      margin: 80px auto;
      padding: 0 32px;
      text-align: center;
    }

    .error-title {
      font-size: 16px;
      letter-spacing: 0.3em;
      color: rgba(240,235,224,0.3);
      margin-bottom: 10px;
    }

    .error-sub {
      font-size: 12px;
      letter-spacing: 0.15em;
      color: rgba(240,235,224,0.18);
    }

    /* ===== フッター ===== */
    .footer {
      padding: 40px 48px;
      border-top: 1px solid rgba(240,235,224,0.06);
      text-align: center;
    }

    .footer-text {
      font-size: 10px;
      letter-spacing: 0.3em;
      color: rgba(240,235,224,0.12);
      text-transform: uppercase;
      font-style: italic;
    }

    /* ===== モバイル ===== */
    @media (max-width: 600px) {
      .site-header { padding: 18px 20px 16px; }
      .breadcrumb { display: none; }
      .hero { height: 38vw; min-height: 180px; }
      .main { padding: 0 18px 60px; }
      .title-block { padding: 32px 0 28px; }
      .exh-title { font-size: 20px; }
      .action-bar { gap: 8px; padding: 20px 0 24px; }
      .btn-icon, .btn-link { font-size: 11px; padding: 8px 14px; }
      .story-section { padding: 36px 0 36px; }
      .story-text { font-size: 13px; line-height: 2.0; }
      .story-text p:first-child::first-letter { font-size: 3em; }
    }
  </style>
</head>
<body>

  <!-- サイトヘッダー（パンくず含む） -->
  <header class="site-header">
    <a href="index.html" class="logo">MUnCh — Tokyo Exhibitions</a>
    <nav class="breadcrumb" id="breadcrumb">
      <a href="index.html">MUnCh</a>
      <span class="breadcrumb-sep">›</span>
      <a href="list.html">一覧</a>
      <span class="breadcrumb-sep">›</span>
      <span class="breadcrumb-current" id="bc-title">…</span>
    </nav>
  </header>

  <!-- ヒーロー画像 -->
  <div class="hero" id="hero-wrap">
    <img class="hero-img" id="hero-img" src="" alt="">
    <div class="hero-overlay"></div>
  </div>

  <!-- エラー時 -->
  <div id="error-block">
    <div class="error-title">展覧会が見つかりませんでした</div>
    <div class="error-sub"><a href="list.html" style="color:rgba(201,168,76,0.7);text-decoration:none;">← 一覧に戻る</a></div>
  </div>

  <!-- メインコンテンツ -->
  <div class="main" id="main-content" style="display:none;">

    <!-- タイトルブロック -->
    <div class="title-block">
      <div class="exh-label">Special Exhibition</div>
      <h1 class="exh-title" id="exh-title"></h1>
      <div class="exh-museum" id="exh-museum"></div>
      <div class="exh-dates" id="exh-dates"></div>
      <div class="exh-copy" id="exh-copy" style="display:none;"></div>
    </div>

    <!-- アクションバー -->
    <div class="action-bar">
      <button class="btn-icon" id="fav-btn" onclick="toggleFav()">
        <span id="fav-icon">♡</span>
        <span id="fav-label">お気に入り</span>
      </button>
      <button class="btn-icon" id="visited-btn" onclick="toggleVisited()">
        <span>✓</span>
        <span id="visited-label">訪問済み</span>
      </button>
      <a class="btn-link" id="official-link" href="#" target="_blank" rel="noopener" style="display:none;">
        公式サイトを見る ↗
      </a>
      <a class="btn-link" id="map-link" href="#" target="_blank" rel="noopener">
        地図で見る
      </a>
      <a class="btn-link" id="route-link" href="#" target="_blank" rel="noopener">
        ルート
      </a>
    </div>

    <!-- ストーリーセクション -->
    <section class="story-section" id="story-section" style="display:none;">
      <div class="section-label">— Story —</div>
      <div class="story-text" id="story-text"></div>
    </section>

    <!-- 感想セクション -->
    <section class="review-section">
      <div class="section-label">— 感想 — <span id="review-count-label" style="color:rgba(240,235,224,0.2);font-size:9px;margin-left:12px;">0件</span></div>
      <div class="review-list" id="review-list"></div>
      <div class="review-form-wrap">
        <input type="text" class="review-name-input" id="review-name" placeholder="ペンネーム（省略可）" maxlength="20">
        <textarea class="review-textarea" id="review-text" placeholder="この展覧会の感想を書いてください..." rows="4" maxlength="300"></textarea>
        <div class="review-form-footer">
          <span class="review-char-count" id="review-char-count">0/300</span>
          <button class="review-submit-btn" id="review-submit-btn" onclick="submitReview()">投稿</button>
        </div>
      </div>
    </section>

  </div>

  <footer class="footer">
    <div class="footer-text">東京の展覧会を、映画のように。</div>
  </footer>

  <script>
  /* ===== ユーティリティ ===== */
  const museumCoords = {
    "東京都美術館":               { lat: 35.7172, lng: 139.7765 },
    "東京国立近代美術館":          { lat: 35.6909, lng: 139.7544 },
    "東京藝術大学大学美術館":      { lat: 35.7188, lng: 139.7753 },
    "国立西洋美術館":              { lat: 35.7155, lng: 139.7757 },
    "上野の森美術館":              { lat: 35.7130, lng: 139.7736 },
    "東京都現代美術館":            { lat: 35.6817, lng: 139.8016 },
    "森美術館":                   { lat: 35.6604, lng: 139.7292 },
    "国立新美術館":                { lat: 35.6655, lng: 139.7279 },
    "サントリー美術館":            { lat: 35.6643, lng: 139.7310 },
    "東京国立博物館":              { lat: 35.7188, lng: 139.7764 },
    "江戸東京博物館":              { lat: 35.6966, lng: 139.7973 },
    "世田谷美術館":                { lat: 35.6321, lng: 139.5898 },
    "東京都写真美術館":            { lat: 35.6412, lng: 139.7133 },
    "アーティゾン美術館":          { lat: 35.6805, lng: 139.7680 },
    "パナソニック汐留美術館":      { lat: 35.6641, lng: 139.7590 },
    "三菱一号館美術館":            { lat: 35.6820, lng: 139.7638 },
    "SOMPO美術館":                { lat: 35.6896, lng: 139.6982 },
    "郷さくら美術館":              { lat: 35.6384, lng: 139.7101 },
    "根津美術館":                  { lat: 35.6599, lng: 139.7161 },
    "山種美術館":                  { lat: 35.6631, lng: 139.7203 },
    "畠山記念館":                  { lat: 35.6488, lng: 139.7344 },
    "五島美術館":                  { lat: 35.6185, lng: 139.6613 },
  };
  const defaultCoord = { lat: 35.6895, lng: 139.6917 };

  function formatDate(s) {
    if (!s) return "—";
    const d = new Date(s);
    if (isNaN(d)) return s;
    return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")}`;
  }

  /* ===== localStorage ヘルパー ===== */
  function getFavs()    { try { return JSON.parse(localStorage.getItem("munch_favs")    || "{}"); } catch { return {}; } }
  function getVisited() { try { return JSON.parse(localStorage.getItem("munch_visited") || "{}"); } catch { return {}; } }

  function setFav(id, val) {
    const f = getFavs(); if (val) f[id] = true; else delete f[id];
    localStorage.setItem("munch_favs", JSON.stringify(f));
  }
  function setVisitedLS(id, val) {
    const v = getVisited(); if (val) v[id] = true; else delete v[id];
    localStorage.setItem("munch_visited", JSON.stringify(v));
  }

  /* ===== 状態 ===== */
  let currentExhibition = null;
  let favId = "";

  /* ===== お気に入りトグル ===== */
  function toggleFav() {
    if (!favId) return;
    const f = getFavs();
    const now = !!f[favId];
    setFav(favId, !now);
    renderFavBtn(!now);
  }

  function renderFavBtn(isFav) {
    const btn = document.getElementById("fav-btn");
    document.getElementById("fav-icon").textContent = isFav ? "♥" : "♡";
    document.getElementById("fav-label").textContent = isFav ? "お気に入り済み" : "お気に入り";
    btn.classList.toggle("fav-active", isFav);
  }

  /* ===== 訪問済みトグル ===== */
  function toggleVisited() {
    if (!favId) return;
    const v = getVisited();
    const now = !!v[favId];
    setVisitedLS(favId, !now);
    renderVisitedBtn(!now);
  }

  function renderVisitedBtn(isVisited) {
    const btn = document.getElementById("visited-btn");
    document.getElementById("visited-label").textContent = isVisited ? "訪問済み ✓" : "訪問済み";
    btn.classList.toggle("visited-active", isVisited);
  }

  /* ===== 感想機能 ===== */
  function loadReviews(title) {
    const all = JSON.parse(localStorage.getItem('munch_reviews') || '{}');
    const reviews = all[title] || [];
    document.getElementById("review-count-label").textContent = `${reviews.length}件`;
    const listEl = document.getElementById("review-list");
    if (reviews.length === 0) {
      listEl.innerHTML = '<div class="review-empty">まだ感想がありません。最初の感想を書いてみましょう。</div>';
      return;
    }
    listEl.innerHTML = reviews.slice(-20).reverse().map(r => `
      <div class="review-item">
        <div class="review-item-header">
          <span>${(r.name || '匿名').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</span>
          <span>${r.date}</span>
        </div>
        <div class="review-item-text">${r.text.replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>')}</div>
      </div>
    `).join('');
  }

  function submitReview() {
    if (!currentExhibition) return;
    const name = document.getElementById("review-name").value.trim();
    const text = document.getElementById("review-text").value.trim();
    if (!text) return;

    const all = JSON.parse(localStorage.getItem('munch_reviews') || '{}');
    const title = currentExhibition.title;
    if (!all[title]) all[title] = [];
    all[title].push({
      name,
      text,
      date: new Date().toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric' })
    });
    localStorage.setItem('munch_reviews', JSON.stringify(all));

    document.getElementById("review-name").value = '';
    document.getElementById("review-text").value = '';
    document.getElementById("review-char-count").textContent = '0/300';

    const btn = document.getElementById("review-submit-btn");
    btn.textContent = '✓ 投稿しました';
    setTimeout(() => btn.textContent = '投稿', 2000);

    loadReviews(title);
  }

  /* ===== メイン描画 ===== */
  function renderExhibition(e) {
    currentExhibition = e;
    favId = `${e.title}__${e.museum}`;

    // タイトル
    document.title = `${e.title} — MUnCh`;

    // パンくず
    document.getElementById("bc-title").textContent = e.title;

    // ヒーロー画像（artwork_url → image_url のフォールバック）
    const heroEl = document.getElementById("hero-img");
    const heroSrc = (e.artwork_url && e.artwork_url !== "") ? e.artwork_url
                  : (e.image_url  && e.image_url  !== "") ? e.image_url
                  : `https://picsum.photos/seed/${encodeURIComponent(e.title)}/1200/600`;
    const heroFallback = (e.image_url && e.image_url !== "") ? e.image_url
                       : `https://picsum.photos/seed/${encodeURIComponent(e.museum)}/1200/600`;
    heroEl.src = heroSrc;
    heroEl.alt = e.title;
    if (heroSrc !== heroFallback) {
      heroEl.onerror = function() { if (this.src !== heroFallback) this.src = heroFallback; };
    }

    // タイトルブロック
    document.getElementById("exh-title").textContent   = e.title;
    document.getElementById("exh-museum").textContent  = e.museum;
    document.getElementById("exh-dates").textContent   = `${formatDate(e.start)} — ${formatDate(e.end)}`;
    if (e.copy) {
      const copyEl = document.getElementById("exh-copy");
      copyEl.textContent  = e.copy;
      copyEl.style.display = "block";
    }

    // アクションバー
    const favs    = getFavs();
    const visited = getVisited();
    renderFavBtn(!!favs[favId]);
    renderVisitedBtn(!!visited[favId]);

    if (e.url) {
      const ol = document.getElementById("official-link");
      ol.href = e.url;
      ol.style.display = "inline-flex";
    }

    const coord = museumCoords[e.museum] || defaultCoord;
    document.getElementById("map-link").href   = `https://www.google.com/maps/search/?api=1&query=${coord.lat},${coord.lng}`;
    document.getElementById("route-link").href = `https://www.google.com/maps/dir/?api=1&destination=${coord.lat},${coord.lng}`;

    // ストーリー
    if (e.story) {
      const storyEl = document.getElementById("story-text");
      storyEl.innerHTML = e.story.split("\n\n").map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`).join("");
      document.getElementById("story-section").style.display = "block";
    }

    // 感想
    loadReviews(e.title);

    // 表示
    document.getElementById("main-content").style.display = "block";
  }

  /* ===== データ読み込み ===== */
  async function init() {
    const params = new URLSearchParams(location.search);
    const targetTitle = params.get("title") || "";

    if (!targetTitle) {
      document.getElementById("error-block").style.display = "block";
      return;
    }

    // パンくずを仮表示
    document.getElementById("bc-title").textContent = decodeURIComponent(targetTitle);

    try {
      const res = await fetch("exhibitions.json");
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      const found = data.find(e => e.title === targetTitle);
      if (!found) throw new Error("not found");
      renderExhibition(found);
    } catch {
      document.getElementById("error-block").style.display = "block";
    }
  }

  /* ===== 文字カウント ===== */
  document.getElementById("review-text").addEventListener("input", function() {
    document.getElementById("review-char-count").textContent = `${this.value.length}/300`;
  });

  init();
  </script>

</body>
</html>
